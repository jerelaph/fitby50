      </div>
      <div class="weighin-controls">
        <span class="weighin-done">✓ ${todays.weight} lb</span>
        <button class="weighin-edit" onclick="weighInEditing=true;renderWeighInCard();">edit</button>
      </div>
    </div>`;
    return;
  }

  const last = getSettings().bodyWeight || '';
  el.innerHTML = `<div class="weighin-row">
    <div>
      <div class="weighin-label">⚖ Weigh-in</div>
      <div class="weighin-sub">Optional — counts on rest days too</div>
    </div>
    <div class="weighin-controls">
      <input type="number" inputmode="decimal" step="0.1" min="0" class="wt-input" id="weighin-input" value="${todays ? todays.weight : last}" placeholder="lb">
      <button class="weighin-save" onclick="saveWeighInFromHome()">LOG</button>
    </div>
  </div>`;
}

function saveWeighInFromHome() {
  const input = document.getElementById('weighin-input');
  const w = Math.round(parseFloat(input.value) * 10) / 10;
  if (!w || w <= 0) { showToast('Enter a weight first'); return; }

  addWeighIn(todayStr(), w);

  const s = getSettings();
  s.bodyWeight = w;
  saveSettings(s);

  // Keep an in-progress log's weigh-in field in step
  const log = getCurrentLog();
  if (log && log.date === todayStr()) {
    log.logBodyWeight = w;
    saveCurrentLog(log);
  }

  weighInEditing = false;
  renderWeighInCard();
  showToast(`Weigh-in logged: ${w} lb`);
  syncToGitHub(true);
}

// Readiness check-in — shown once per day, before the workout
function renderReadinessCard() {
  const el = document.getElementById('readiness-card');
  if (!el) return;
  const done = getHistory().some(h => h.date === todayStr());
  if (getReadiness() !== null || done || currentDayType === 'recovery') { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="readiness-card">
    <div class="readiness-title">How's the tank today?</div>
    <div class="readiness-btns">
      <button class="readiness-btn" onclick="selectReadiness('low')"><span>😴</span>Low</button>
      <button class="readiness-btn" onclick="selectReadiness('ok')"><span>😐</span>OK</button>
      <button class="readiness-btn" onclick="selectReadiness('high')"><span>🔥</span>Ready</button>
    </div>
  </div>`;
}

function selectReadiness(level) {
  setReadiness(level);
  localStorage.removeItem(STORAGE_KEYS.currentWod);
  localStorage.removeItem(STORAGE_KEYS.currentLog);
  renderToday();
  if (level === 'low') showToast('Scaled today down — showing up still counts');
  else if (level === 'high') showToast('Let\'s go 🔥');
}

function renderWeekTracker() {
  const el = document.getElementById('week-tracker');
  if (!el) return;
  const history = getHistory();
  const today = new Date();

  // Get Monday of current week
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((dow + 6) % 7));

  const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const dayColors = {
    weekday: 'var(--strength)', saturday: 'var(--strengthcon)',
    sunday: 'var(--hiit)', recovery: 'var(--recovery)'
  };
  const intenseDayTypes = ['weekday', 'saturday', 'sunday']; // non-recovery

  let daysHtml = '';

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dateStr = localDateStr(d);
    const isToday = dateStr === todayStr();

    const workout = history.find(h => h.date === dateStr);
    let dotStyle = '';
    let dotClass = isToday ? 'today' : '';
    let checkMark = '';

    if (workout) {
      const color = dayColors[workout.dayType] || 'var(--bg4)';
      dotStyle = `background:${color};`;
      dotClass += ' active';
      checkMark = '✓';
    }

    daysHtml += `<div class="week-day">
      <div class="week-dot ${dotClass}" style="${dotStyle}">${checkMark}</div>
      ${dayLabels[i]}
    </div>`;
  }

  const stats = computeWeekStats(history);
  const z2Target = getSettings().z2Target || 90;
  const activeGoal = stats.active >= 3;
  const intenseGoal = stats.intense >= 3;
  const z2Goal = stats.z2 >= z2Target;

  const streaks = computeStreaks(history);
  let streakHtml = '';
  if (history.length > 0) {
    const shield = streaks.shieldAvailable
      ? '🛡 shield ready'
      : '🛡 shield used this month';
    streakHtml = `<div class="streak-strip">
      <span class="streak-main">🔥 ${streaks.current}-week streak</span>
      <span>Best: ${streaks.best}</span>
      <span>#${history.length} total</span>
      <span class="streak-shield">${shield}</span>
    </div>`;
  }

  el.innerHTML = `<div class="week-tracker">
    <div class="week-days">${daysHtml}</div>
    <div class="week-goals">
      <div class="week-goal ${activeGoal ? 'hit' : ''}">
        <div class="week-goal-dot"></div>
        ${stats.active}/3 Active
      </div>
      <div class="week-goal ${intenseGoal ? 'hit' : ''}">
        <div class="week-goal-dot"></div>
        ${stats.intense}/3 Intense
      </div>
      <div class="week-goal ${z2Goal ? 'hit' : ''}">
        <div class="week-goal-dot"></div>
        ${stats.z2}/${z2Target} Z2 min
      </div>
    </div>
    ${streakHtml}
  </div>`;
}

function renderRotation() {
  const idx = getRotationIndex();
  const el = document.getElementById('rotation-display');
  const labels = ['SQ', 'BN', 'DL', 'PR'];
  el.innerHTML = LIFT_ROTATION.map((_, i) => {
    const cls = i === idx ? 'active' : (i < idx ? 'completed' : '');
    return `<div class="rotation-dot ${cls}"></div>`;
  }).join('') + `<span class="rotation-label">Next: ${labels[idx]} (${PRIMARY_LIFTS[LIFT_ROTATION[idx]][0]})</span>`;
}

function renderWodContent(wod) {
  const el = document.getElementById('wod-content');
  let html = '';

  // Section progress dots
  html += '<div class="section-progress">';
  wod.sections.forEach(s => {
    const colorMap = { warmup: 'var(--warmup)', strength: 'var(--strength)', core: 'var(--core)', metcon: 'var(--metcon)', strengthcon: 'var(--strengthcon)', hiit: 'var(--hiit)', power: 'var(--hiit)', glute: 'var(--core)', 'recovery-warmup': 'var(--recovery)', 'recovery-cardio': 'var(--recovery)' };
    html += `<div class="section-dot" style="background:${colorMap[s.type] || 'var(--bg4)'}"></div>`;
  });
  html += '</div>';

  if (wod.scaled) {
    html += `<div class="scaled-badge">↓ Scaled for recovery — lighter loads, one fewer round. Showing up is the win.</div>`;
  }

  wod.sections.forEach((section, si) => {
    html += renderSection(section, si);
  });

  el.innerHTML = html;
}

// Shared exercise list with per-exercise swap buttons (autonomy without
// rerolling the whole WOD)
function exListHtml(section, si, flagFn) {
  let h = '<ul class="exercise-list">';
  section.exercises.forEach((e, ei) => {
    const swappable = !e.isBarbell;
    const flag = flagFn ? (flagFn(e) || '') : '';
    const nameHtml = CUES[e.name]
      ? `<span onclick="showCue(this.dataset.n)" data-n="${e.name.replace(/"/g, '&quot;')}" style="border-bottom:1px dotted var(--text3);cursor:pointer;">${e.name}</span>`
      : e.name;
    if (e.isBarbell && typeof e.weight === 'number') {
      // Barbell station: prescribed load is editable in place
      h += `<li style="flex-wrap:wrap;">${nameHtml} ${flag}<span class="exercise-rep">${e.reps}</span>
        <div class="station-wt" style="flex-basis:100%;">
          <span class="station-wt-label">Load:</span>
          <button class="wt-btn" onclick="bumpStationWeight(${si},${ei},-5)">−</button>
          <input type="number" inputmode="numeric" step="5" min="0" class="wt-input ${e.edited ? 'wt-edited' : ''}" value="${e.weight || 0}" onchange="setStationWeightManual(${si},${ei},this.value)">
          <button class="wt-btn" onclick="bumpStationWeight(${si},${ei},5)">+</button>
          ${e.edited ? `<button class="wt-reset" onclick="resetStationWeight(${si},${ei})">reset</button>` : ''}
        </div>
      </li>`;
    } else {
      h += `<li>${swappable ? `<button class="ex-swap" onclick="swapExercise(${si},${ei})" title="Swap this exercise">⇄</button>` : ''}${nameHtml} ${flag}<span class="exercise-rep">${e.reps}</span></li>`;
    }
  });
  h += '</ul>';
  return h;
}

function renderSection(section, si) {
  const settings = getSettings();
  const typeClass = section.type === 'glute' ? 'core' : section.type === 'power' ? 'hiit' : section.type.startsWith('recovery') ? 'recovery' : section.type;
  let html = `<div class="card card-${typeClass}">`;
  html += `<div class="card-label label-${typeClass}">${section.label}</div>`;

  if (section.type === 'warmup') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si);
    html += `<div style="margin-top:12px"><button class="btn btn-warmup btn-sm" onclick="openTimerConfig('interval', ${section.work}, ${section.rest}, ${section.rounds}, ${section.exercises.length}, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'strength') {
    const phaseBadgeColor = section.phaseKey === 'deload' ? 'recovery' : section.phaseKey === 'benchmark' ? 'core' : 'strength';
    html += `<div class="card-title">${section.mainLift} <span class="deload-badge" style="background:rgba(127,119,221,0.15);color:var(--${phaseBadgeColor});">${section.phaseLabel || ''}</span></div>`;
    html += `<div class="card-meta">${section.format} — ${section.reps} reps/round — Build Each Round</div>`;
    if (section.phaseNote) {
      html += `<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">${section.phaseNote}</div>`;
    }
    if (section.tempoNote) {
      html += `<div style="font-size:12px;color:var(--core);margin-bottom:8px;">⏱ ${section.tempoNote}</div>`;
    }
    if (CUES[section.mainLift]) {
      html += `<div style="font-size:12px;color:var(--text3);margin-bottom:8px;font-style:italic;">💡 ${CUES[section.mainLift]}</div>`;
    }
    if (section.autoRegulated) {
      html += `<div style="font-size:12px;color:var(--caution);margin-bottom:8px;">Auto-regulated −7.5% after last session's fails. A clean session resets it.</div>`;
    }
    if (section.oneRM > 0) {
      html += `<div style="font-size:12px;color:var(--text3);margin-bottom:8px;">1RM: ${section.oneRM} lb</div>`;
    }

    if (section.herniaMode) {
      const rules = herniaPhaseRules(settings);
      html += `<div style="margin-bottom:8px;"><span style="font-size:12px;color:var(--caution);">${rules.rpeNote}</span></div>`;
      if (section.herniaFlags.length > 0) {
        html += `<div style="font-size:11px;color:var(--text3);margin-bottom:8px;">⚠ ${HERNIA_CUE}</div>`;
      }
    }

    html += '<table class="weight-table"><thead><tr><th>Round</th><th>Weight (lb)</th><th>%</th></tr></thead><tbody>';
    section.weights.forEach((w, i) => {
      const flagged = section.herniaFlags.includes(i);
      const noLoad = w.weight <= 0 && !w.edited;
      html += `<tr><td>${i+1}</td><td>
        <div class="wt-edit">
          <button class="wt-btn" onclick="bumpWeight(${si},${i},-5)">−</button>
          <input type="number" inputmode="numeric" step="5" min="0" class="wt-input ${w.edited ? 'wt-edited' : ''}" value="${w.weight || 0}" onchange="setWeightManual(${si},${i},this.value)" ${noLoad ? 'placeholder="BW"' : ''}>
          <button class="wt-btn" onclick="bumpWeight(${si},${i},5)">+</button>
        </div>
        ${flagged ? '<div style="margin-top:4px;"><span class="caution-badge">CAUTION</span></div>' : ''}
      </td><td>${section.oneRM > 0 && w.weight > 0 ? w.pct + '%' + (w.edited ? '<span style="color:var(--core);">*</span>' : '') : (noLoad ? 'BW' : '—')}</td></tr>`;
    });
    html += '</tbody></table>';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:11px;color:var(--text3);">Feels off? Adjust — the log follows automatically.</div>
      ${section.weights.some(w => w.edited) ? `<button class="wt-reset" onclick="resetWeights(${si})">Reset to plan</button>` : ''}
    </div>`;

    if (section.accessory.length > 0) {
      html += '<div style="margin-top:10px;font-size:13px;color:var(--text3);font-weight:600;">Accessory (remaining time):</div>';
      html += '<ul class="exercise-list">';
      section.accessory.forEach((e, ai) => {
        html += `<li><button class="ex-swap" onclick="swapAccessory(${si},${ai})" title="Swap this exercise">⇄</button>${e.name}<span class="exercise-rep">${e.reps}</span></li>`;
      });
      html += '</ul>';
    }

    html += `<div style="margin-top:12px"><button class="btn btn-strength btn-sm" onclick="openTimerConfig('emom', ${section.formatDetail.time}, 0, ${section.formatDetail.rounds}, 0, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'core') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si);
    if (section.coreAmrap) {
      html += `<div style="margin-top:12px"><button class="btn btn-core btn-sm" onclick="openTimerConfig('amrap', ${section.duration}, 0, 0, 0, ${si})">START 5 MIN TIMER</button></div>`;
    } else {
      html += `<div style="margin-top:12px"><button class="btn btn-core btn-sm" onclick="openTimerConfig('interval', ${section.work}, ${section.rest}, ${section.rounds}, ${section.exercises.length}, ${si})">START TIMER</button></div>`;
    }
  }

  else if (section.type === 'power') {
    html += `<div class="card-meta">${section.format}</div>`;
    const move = section.exercises[0];
    html += `<div class="card-title" style="font-size:16px;">${move.name}</div>`;
    if (CUES[move.name]) {
      html += `<div style="font-size:12px;color:var(--text3);margin:4px 0 8px;font-style:italic;">💡 ${CUES[move.name]}</div>`;
    }
    html += `<div style="font-size:12px;color:var(--text2);">${section.powerNote}</div>`;
    html += `<div style="margin-top:10px;"><button class="ex-swap" onclick="swapExercise(${si},0)" title="Swap">⇄ swap movement</button></div>`;
  }

  else if (section.type === 'metcon') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si, (e) => (section.herniaMode && section.herniaExercises.includes(e.name)) ? '<span class="caution-badge">Scale</span>' : '');
    const tc = section.timerConfig;
    if (tc.mode === 'amrap') {
      html += `<div style="margin-top:12px"><button class="btn btn-metcon btn-sm" onclick="openTimerConfig('amrap', ${tc.duration}, 0, 0, 0, ${si})">START TIMER</button></div>`;
    } else if (tc.mode === 'forTime') {
      html += `<div style="margin-top:12px"><button class="btn btn-metcon btn-sm" onclick="openTimerConfig('forTime', ${tc.cap}, 0, ${tc.rounds || 0}, 0, ${si})">START TIMER</button></div>`;
    } else if (tc.mode === 'emom') {
      html += `<div style="margin-top:12px"><button class="btn btn-metcon btn-sm" onclick="openTimerConfig('emom', ${tc.interval}, 0, ${Math.floor(tc.duration / tc.interval)}, 0, ${si})">START TIMER</button></div>`;
    }
  }

  else if (section.type === 'strengthcon') {
    if (section.wodName) {
      html += `<div class="card-title" style="font-size:15px;">"${section.wodName}"</div>`;
    }
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si, (e) => (section.herniaMode && isHerniaFlagged(e.name, e.pct || 0, settings)) ? '<span class="caution-badge">CAUTION</span>' : '');
    html += `<div style="margin-top:12px"><button class="btn btn-strengthcon btn-sm" onclick="openTimerConfig('forTime', ${section.cap}, 0, ${section.rounds}, 0, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'hiit') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si);
    html += `<div style="margin-top:12px"><button class="btn btn-hiit btn-sm" onclick="openTimerConfig('interval', ${section.work}, ${section.rest}, ${section.rounds}, ${section.exercises.length}, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'glute') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si);
    html += `<div style="margin-top:12px"><button class="btn btn-core btn-sm" onclick="openTimerConfig('interval', ${section.work}, ${section.rest}, ${section.rounds}, ${section.exercises.length}, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'recovery-warmup') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += exListHtml(section, si);
    html += `<div style="margin-top:12px"><button class="btn btn-recovery btn-sm" onclick="openTimerConfig('interval', ${section.work}, ${section.rest}, ${section.rounds}, ${section.exercises.length}, ${si})">START TIMER</button></div>`;
  }

  else if (section.type === 'recovery-cardio') {
    html += `<div class="card-meta">${section.format}</div>`;
    html += '<div style="margin-top:12px;">';
    section.protocol.forEach(step => {
      html += `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg3);">
        <span style="font-weight:600;color:var(--recovery);">${step.label}</span>
        <span style="color:var(--text2);font-size:14px;">${step.detail}</span>
      </div>`;
    });
    html += '</div>';
    html += `<div style="margin-top:12px"><button class="btn btn-recovery btn-sm" onclick="openTimerConfig('forTime', ${section.duration * 60}, 0, 0, 0, ${si})">START ${section.duration} MIN TIMER</button></div>`;
  }

  html += '</div>';
  return html;
}

// ============================================================
// TIMER
// ============================================================

let timerState = null;
let timerInterval = null;
let audioCtx = null;
let timerExercises = []; // [{name, reps}] for current timer section
let timerCfgTargetRounds = 0; // "X RDS for time" target for the lap counter

function timerSoundMode() {
  return getSettings().timerSound || 'beep';
}

function getAudioCtx() {
  if (timerSoundMode() !== 'beep') return null; // vibrate/silent: never touch the audio system
  if (!audioCtx) {
    // iOS 17+ Audio Session API: 'ambient' mixes our beeps WITH music
    // (Spotify/Apple Music keep playing) instead of interrupting it.
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch(e) {}
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBeep(freq, duration, type) {
  if (timerSoundMode() !== 'beep') return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.3;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playWorkBeep() {
  playBeep(880, 0.15, 'sine');
  setTimeout(() => playBeep(1100, 0.2, 'sine'), 180);
}

function playRestBeep() {
  playBeep(440, 0.3, 'triangle');
}

function playFinishBeep() {
  playBeep(880, 0.1, 'sine');
  setTimeout(() => playBeep(1100, 0.1, 'sine'), 120);
  setTimeout(() => playBeep(1320, 0.3, 'sine'), 240);
}

function playCountdownBeep() {
  playBeep(660, 0.08, 'sine');
}

function vibrate(pattern) {
  if (timerSoundMode() === 'silent') return;
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch(e) {}
  }
}

function openTimerConfig(mode, param1, param2, param3, param4, sectionIdx) {
  // Initialize audio context on first user interaction
  getAudioCtx();

  // Target rounds for lap-counted modes (forTime "X RDS", AMRAP goal)
  timerCfgTargetRounds = (mode === 'forTime') ? (param3 || 0) : 0;

  // Grab exercises from the current WOD section
  timerExercises = [];
  if (currentWod && typeof sectionIdx === 'number' && currentWod.sections[sectionIdx]) {
    const sec = currentWod.sections[sectionIdx];
    if (sec.exercises) {
      timerExercises = sec.exercises.map(e => ({ name: e.name, reps: e.reps || '' }));
    } else if (sec.protocol) {
      timerExercises = sec.protocol.map(p => ({ name: p.label, reps: p.detail || '' }));
    }
  }

  const sheet = document.getElementById('timer-config-sheet');
  let html = '';

  if (mode === 'interval') {
    const work = param1, rest = param2, rounds = param3, stations = param4;
    html = `
      <div class="timer-config-title">Interval Timer</div>
      <div class="timer-config-row"><span class="timer-config-label">Work</span>
        <div class="timer-config-value"><button onclick="adjustConfig('work',-5)">-</button><span id="cfg-work">${work}</span><button onclick="adjustConfig('work',5)">+</button></div></div>
      <div class="timer-config-row"><span class="timer-config-label">Rest</span>
        <div class="timer-config-value"><button onclick="adjustConfig('rest',-5)">-</button><span id="cfg-rest">${rest}</span><button onclick="adjustConfig('rest',5)">+</button></div></div>
      <div class="timer-config-row"><span class="timer-config-label">Rounds</span>
        <div class="timer-config-value"><button onclick="adjustConfig('rounds',-1)">-</button><span id="cfg-rounds">${rounds}</span><button onclick="adjustConfig('rounds',1)">+</button></div></div>
      <div class="timer-config-row"><span class="timer-config-label">Stations</span>
        <div class="timer-config-value"><button onclick="adjustConfig('stations',-1)">-</button><span id="cfg-stations">${stations}</span><button onclick="adjustConfig('stations',1)">+</button></div></div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="startIntervalTimer()">START</button></div>
      <div style="margin-top:8px"><button class="btn btn-ghost" onclick="closeTimerConfig()">Cancel</button></div>
    `;
  } else if (mode === 'emom') {
    const time = param1, rounds = param3;
    html = `
      <div class="timer-config-title">EMOM Timer</div>
      <div class="timer-config-row"><span class="timer-config-label">Time/Round (sec)</span>
        <div class="timer-config-value"><button onclick="adjustConfig('emomTime',-30)">-</button><span id="cfg-emomTime">${time}</span><button onclick="adjustConfig('emomTime',30)">+</button></div></div>
      <div class="timer-config-row"><span class="timer-config-label">Rounds</span>
        <div class="timer-config-value"><button onclick="adjustConfig('emomRounds',-1)">-</button><span id="cfg-emomRounds">${rounds}</span><button onclick="adjustConfig('emomRounds',1)">+</button></div></div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="startEmomTimer()">START</button></div>
      <div style="margin-top:8px"><button class="btn btn-ghost" onclick="closeTimerConfig()">Cancel</button></div>
    `;
  } else if (mode === 'amrap') {
    const duration = param1;
    const mins = Math.floor(duration / 60);
    html = `
      <div class="timer-config-title">AMRAP Timer</div>
      <div class="timer-config-row"><span class="timer-config-label">Minutes</span>
        <div class="timer-config-value"><button onclick="adjustConfig('amrapMins',-1)">-</button><span id="cfg-amrapMins">${mins}</span><button onclick="adjustConfig('amrapMins',1)">+</button></div></div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="startAmrapTimer()">START</button></div>
      <div style="margin-top:8px"><button class="btn btn-ghost" onclick="closeTimerConfig()">Cancel</button></div>
    `;
  } else if (mode === 'forTime') {
    const cap = param1;
    const capMins = Math.floor(cap / 60);
    const rounds = param3;
    html = `
      <div class="timer-config-title">For Time</div>
      ${rounds > 0 ? `<div class="timer-config-row"><span class="timer-config-label">Target Rounds</span><span style="font-weight:700">${rounds}</span></div>` : ''}
      <div class="timer-config-row"><span class="timer-config-label">Cap (min)</span>
        <div class="timer-config-value"><button onclick="adjustConfig('capMins',-1)">-</button><span id="cfg-capMins">${capMins}</span><button onclick="adjustConfig('capMins',1)">+</button></div></div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="startForTimeTimer()">START</button></div>
      <div style="margin-top:8px"><button class="btn btn-ghost" onclick="closeTimerConfig()">Cancel</button></div>
    `;
  }

  sheet.innerHTML = html;
  document.getElementById('timer-config').classList.add('active');
}

function adjustConfig(field, delta) {
  const el = document.getElementById('cfg-' + field);
  if (!el) return;
  let val = parseInt(el.textContent) + delta;
  if (field === 'work' || field === 'rest') val = Math.max(5, val);
  else if (field === 'rounds' || field === 'stations' || field === 'emomRounds') val = Math.max(1, val);
  else if (field === 'emomTime') val = Math.max(30, val);
  else if (field === 'amrapMins' || field === 'capMins') val = Math.max(1, val);
  el.textContent = val;
}

function closeTimerConfig() {
  document.getElementById('timer-config').classList.remove('active');
}

function startIntervalTimer() {
  closeTimerConfig();
  const work = parseInt(document.getElementById('cfg-work').textContent);
  const rest = parseInt(document.getElementById('cfg-rest').textContent);
  const rounds = parseInt(document.getElementById('cfg-rounds').textContent);
  const stations = parseInt(document.getElementById('cfg-stations').textContent);
  const totalStations = stations > 0 ? stations : 1;

  timerState = {
    mode: 'interval',
    work: work, rest: rest,
    totalRounds: rounds, totalStations: totalStations,
    currentRound: 1, currentStation: 1,
    phase: 'getReady',
    secondsLeft: 10,
    totalSeconds: 10,
    paused: false, finished: false,
    exercises: [...timerExercises]
  };

  showTimerOverlay();
  runTimer();
}

function startEmomTimer() {
  closeTimerConfig();
  const time = parseInt(document.getElementById('cfg-emomTime').textContent);
  const rounds = parseInt(document.getElementById('cfg-emomRounds').textContent);

  timerState = {
    mode: 'emom',
    roundTime: time, totalRounds: rounds,
    currentRound: 1,
    phase: 'getReady',
    secondsLeft: 10,
    totalSeconds: 10,
    paused: false, finished: false,
    exercises: [...timerExercises]
  };

  showTimerOverlay();
  runTimer();
}

function startAmrapTimer() {
  closeTimerConfig();
  const mins = parseInt(document.getElementById('cfg-amrapMins').textContent);

  timerState = {
    mode: 'amrap',
    totalTime: mins * 60,
    elapsed: 0,
    roundsDone: 0,
    phase: 'getReady',
    secondsLeft: 10,
    totalSeconds: 10,
    paused: false, finished: false,
    exercises: [...timerExercises]
  };

  showTimerOverlay();
  runTimer();
}

function startForTimeTimer() {
  closeTimerConfig();
  const capMins = parseInt(document.getElementById('cfg-capMins').textContent);

  timerState = {
    mode: 'forTime',
    cap: capMins * 60,
    elapsed: 0,
    roundsDone: 0,
    targetRounds: timerCfgTargetRounds || 0,
    finalTime: 0,
    phase: 'getReady',
    secondsLeft: 10,
    totalSeconds: 10,
    paused: false, finished: false,
    exercises: [...timerExercises]
  };

  showTimerOverlay();
  runTimer();
}

function showTimerOverlay() {
  document.getElementById('timer-overlay').classList.add('active');
  updateTimerDisplay();
}

function hideTimerOverlay() {
  document.getElementById('timer-overlay').classList.remove('active');
}

function runTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
}

function tickTimer() {
  if (!timerState || timerState.paused || timerState.finished) return;

  if (timerState.mode === 'interval') tickInterval();
  else if (timerState.mode === 'emom') tickEmom();
  else if (timerState.mode === 'amrap') tickAmrap();
  else if (timerState.mode === 'forTime') tickForTime();

  updateTimerDisplay();
}

function tickInterval() {
  const s = timerState;
  s.secondsLeft--;

  // Countdown beeps for last 3 seconds
  if (s.secondsLeft <= 3 && s.secondsLeft > 0) {
    playCountdownBeep();
    vibrate(50);
  }

  if (s.secondsLeft <= 0) {
    if (s.phase === 'getReady') {
      s.phase = 'work';
      s.secondsLeft = s.work;
      s.totalSeconds = s.work;
      playWorkBeep();
      vibrate([100, 50, 100]);
    } else if (s.phase === 'work') {
      if (s.currentStation < s.totalStations) {
        // Next station in same round — rest between stations
        s.phase = 'rest';
        s.secondsLeft = s.rest;
        s.totalSeconds = s.rest;
        playRestBeep();
        vibrate(200);
      } else if (s.currentRound < s.totalRounds) {
        // End of round — rest, then next round
        s.phase = 'rest';
        s.secondsLeft = s.rest;
        s.totalSeconds = s.rest;
        s.currentStation = 0; // will be incremented when work starts
        playRestBeep();
        vibrate(200);
      } else {
        // All done
        s.finished = true;
        playFinishBeep();
        vibrate([200, 100, 200, 100, 400]);
        clearInterval(timerInterval);
      }
    } else if (s.phase === 'rest') {
      s.phase = 'work';
      if (s.currentStation === 0) {
        // New round
        s.currentRound++;
        s.currentStation = 1;
      } else {
        s.currentStation++;
      }
      s.secondsLeft = s.work;
      s.totalSeconds = s.work;
      playWorkBeep();
      vibrate([100, 50, 100]);
    }
  }
}

function tickEmom() {
  const s = timerState;
  s.secondsLeft--;

  if (s.secondsLeft <= 3 && s.secondsLeft > 0 && s.phase !== 'getReady') {
    playCountdownBeep();
    vibrate(50);
  }

  if (s.secondsLeft <= 0) {
    if (s.phase === 'getReady') {
      s.phase = 'work';
      s.secondsLeft = s.roundTime;
      s.totalSeconds = s.roundTime;
      playWorkBeep();
      vibrate([100, 50, 100]);
    } else if (s.currentRound < s.totalRounds) {
      s.currentRound++;
      s.secondsLeft = s.roundTime;
      s.totalSeconds = s.roundTime;
      playWorkBeep();
      vibrate([100, 50, 100]);
    } else {
      s.finished = true;
      playFinishBeep();
      vibrate([200, 100, 200, 100, 400]);
      clearInterval(timerInterval);
    }
  }
}

function tickAmrap() {
  const s = timerState;
  if (s.phase === 'getReady') {
    s.secondsLeft--;
    if (s.secondsLeft <= 3 && s.secondsLeft > 0) {
      playCountdownBeep();
      vibrate(50);
    }
    if (s.secondsLeft <= 0) {
      s.phase = 'work';
      s.elapsed = 0;
      playWorkBeep();
      vibrate([100, 50, 100]);
    }
  } else {
    s.elapsed++;
    const remaining = s.totalTime - s.elapsed;
    if (remaining <= 3 && remaining > 0) {
      playCountdownBeep();
      vibrate(50);
    }
    if (s.elapsed >= s.totalTime) {
      s.finished = true;
      playFinishBeep();
      vibrate([200, 100, 200, 100, 400]);
      clearInterval(timerInterval);
    }
  }
}

function tickForTime() {
  const s = timerState;
  if (s.phase === 'getReady') {
    s.secondsLeft--;
    if (s.secondsLeft <= 3 && s.secondsLeft > 0) {
      playCountdownBeep();
      vibrate(50);
    }
    if (s.secondsLeft <= 0) {
      s.phase = 'work';
      s.elapsed = 0;
      playWorkBeep();
      vibrate([100, 50, 100]);
    }
  } else {
    s.elapsed++;
    if (s.elapsed >= s.cap) {
      s.finished = true;
      playFinishBeep();
      vibrate([200, 100, 200, 100, 400]);
      clearInterval(timerInterval);
    }
  }
}

function updateTimerDisplay() {
  const s = timerState;
  if (!s) return;

  const phaseEl = document.getElementById('timer-phase');
  const digitsEl = document.getElementById('timer-digits');
  const roundEl = document.getElementById('timer-round');
  const infoEl = document.getElementById('timer-info');
  const progressBar = document.getElementById('timer-progress-bar');
  const pauseBtn = document.getElementById('timer-btn-pause');
  const exNameEl = document.getElementById('timer-exercise-name');
  const exRepEl = document.getElementById('timer-exercise-rep');
  const exListEl = document.getElementById('timer-exercise-list');

  pauseBtn.textContent = s.paused ? '▶' : '||';

  if (s.finished) {
    phaseEl.textContent = 'DONE';
    phaseEl.className = 'timer-phase work';
    digitsEl.textContent = s.finalTime > 0 ? formatTime(s.finalTime) : '0:00';
    digitsEl.style.color = 'var(--success)';
    roundEl.textContent = s.finalTime > 0
      ? `Finished — ${s.targetRounds} rounds in ${formatTime(s.finalTime)}`
      : (s.mode === 'amrap' && s.roundsDone > 0 ? `Time! ${s.roundsDone} rounds completed` : 'Workout Complete!');
    infoEl.textContent = '';
    progressBar.style.width = '100%';
    progressBar.style.background = 'var(--success)';
    const lw = document.getElementById('timer-lap-wrap');
    if (lw) lw.style.display = 'none';
    return;
  }

  digitsEl.style.color = 'var(--text)';

  if (s.phase === 'getReady') {
    phaseEl.textContent = 'GET READY';
    phaseEl.className = 'timer-phase get-ready';
    digitsEl.textContent = formatTime(s.secondsLeft);
    roundEl.textContent = '';
    infoEl.textContent = s.mode === 'interval' ? `${s.totalRounds} rounds, ${s.totalStations} stations` :
                         s.mode === 'emom' ? `${s.totalRounds} rounds EMOM` :
                         s.mode === 'amrap' ? `${formatTime(s.totalTime)} AMRAP` :
                         `For Time (${formatTime(s.cap)} cap)`;
    progressBar.style.width = ((10 - s.secondsLeft) / 10 * 100) + '%';
    progressBar.style.background = 'var(--core)';
    return;
  }

  if (s.mode === 'interval') {
    phaseEl.textContent = s.phase === 'work' ? 'WORK' : 'REST';
    phaseEl.className = 'timer-phase ' + s.phase;
    digitsEl.textContent = formatTime(s.secondsLeft);
    roundEl.textContent = `Round ${s.currentRound} / ${s.totalRounds}`;
    infoEl.textContent = s.totalStations > 1 ? `Station ${s.currentStation} / ${s.totalStations}` : '';
    const pct = ((s.totalSeconds - s.secondsLeft) / s.totalSeconds) * 100;
    progressBar.style.width = pct + '%';
    progressBar.style.background = s.phase === 'work' ? 'var(--success)' : 'var(--danger)';
  }
  else if (s.mode === 'emom') {
    phaseEl.textContent = 'WORK';
    phaseEl.className = 'timer-phase work';
    digitsEl.textContent = formatTime(s.secondsLeft);
    roundEl.textContent = `Round ${s.currentRound} / ${s.totalRounds}`;
    infoEl.textContent = `EMOM ${formatTime(s.roundTime)}`;
    const pct = ((s.roundTime - s.secondsLeft) / s.roundTime) * 100;
    progressBar.style.width = pct + '%';
    progressBar.style.background = 'var(--strength)';
  }
  else if (s.mode === 'amrap') {
    phaseEl.textContent = 'AMRAP';
    phaseEl.className = 'timer-phase work';
    const remaining = s.totalTime - s.elapsed;
    digitsEl.textContent = formatTime(remaining);
    roundEl.textContent = `Rounds done: ${s.roundsDone || 0}`;
    infoEl.textContent = `${formatTime(s.elapsed)} elapsed — tap ✓ each round`;
    const pct = (s.elapsed / s.totalTime) * 100;
    progressBar.style.width = pct + '%';
    progressBar.style.background = 'var(--metcon)';
  }
  else if (s.mode === 'forTime') {
    phaseEl.textContent = 'FOR TIME';
    phaseEl.className = 'timer-phase work';
    digitsEl.textContent = formatTime(s.elapsed);
    if (s.targetRounds > 0) {
      roundEl.textContent = `Round ${Math.min((s.roundsDone || 0) + 1, s.targetRounds)} / ${s.targetRounds}`;
      infoEl.textContent = `Cap: ${formatTime(s.cap)} — tap ✓ each round`;
    } else {
      roundEl.textContent = `Cap: ${formatTime(s.cap)}`;
      infoEl.textContent = '';
    }
    const pct = (s.elapsed / s.cap) * 100;
    progressBar.style.width = pct + '%';
    progressBar.style.background = 'var(--metcon)';
  }

  // Lap button: only for user-paced modes, only while running
  const lapWrap = document.getElementById('timer-lap-wrap');
  if (lapWrap) {
    const lappable = (s.mode === 'amrap' || (s.mode === 'forTime' && s.targetRounds > 0));
    lapWrap.style.display = (lappable && s.phase !== 'getReady' && !s.finished) ? '' : 'none';
  }

  // --- Exercise display ---
  const exs = s.exercises || [];
  if (exs.length === 0) {
    exNameEl.textContent = '';
    exRepEl.textContent = '';
    exListEl.innerHTML = '';
  } else if (s.mode === 'interval' && exs.length > 0) {
    // For interval mode: highlight current station's exercise
    const stationIdx = (s.currentStation - 1) % exs.length;
    const current = exs[stationIdx];
    if (s.phase === 'getReady') {
      exNameEl.textContent = 'First up: ' + exs[0].name;
      exRepEl.textContent = exs[0].reps || '';
    } else if (s.phase === 'work') {
      exNameEl.textContent = current.name;
      exRepEl.textContent = current.reps || '';
    } else if (s.phase === 'rest') {
      const nextIdx = s.currentStation % exs.length;
      exNameEl.textContent = '→ Next: ' + exs[nextIdx].name;
      exRepEl.textContent = '';
    }
    // Show exercise list with current highlighted
    let listHtml = '';
    exs.forEach((e, i) => {
      const cls = i === stationIdx && s.phase !== 'getReady' ? 'current' : '';
      listHtml += `<div class="timer-exercise-item ${cls}"><span>${e.name}</span><span class="ex-reps">${e.reps || ''}</span></div>`;
    });
    exListEl.innerHTML = listHtml;
  } else {
    // For AMRAP, forTime, EMOM: show full exercise list
    exNameEl.textContent = '';
    exRepEl.textContent = '';
    let listHtml = '';
    exs.forEach(e => {
      listHtml += `<div class="timer-exercise-item"><span>${e.name}</span><span class="ex-reps">${e.reps || ''}</span></div>`;
    });
    exListEl.innerHTML = listHtml;
  }

  if (s.finished) {
    exNameEl.textContent = '';
    exRepEl.textContent = '';
    exListEl.innerHTML = '';
  }
}

// Lap counter for user-paced modes (forTime rounds, AMRAP rounds)
function markRoundDone() {
  const s = timerState;
  if (!s || s.finished || s.phase === 'getReady') return;
  s.roundsDone = (s.roundsDone || 0) + 1;
  vibrate(50);
  playWorkBeep();
  if (s.mode === 'forTime' && s.targetRounds > 0 && s.roundsDone >= s.targetRounds) {
    s.finalTime = s.elapsed;
    s.finished = true;
    playFinishBeep();
    vibrate([100, 50, 100, 50, 200]);
  }
  updateTimerDisplay();
}

function toggleTimerPause() {
  if (!timerState) return;
  timerState.paused = !timerState.paused;
  updateTimerDisplay();
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerState = null;
  hideTimerOverlay();
}

// ============================================================
// LOG VIEW
// ============================================================

function renderLog() {
  const el = document.getElementById('log-content');
  const wod = getCurrentWod();
  if (!wod) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Generate today\'s WOD first</div></div>';
    return;
  }

  // Load existing log or create new
  let log = getCurrentLog();
  if (!log || log.date !== wod.date || log.dayType !== wod.dayType) {
    log = buildLogFromWod(wod);
    saveCurrentLog(log);
  }

  let html = `<div style="font-size:13px;color:var(--text3);margin-bottom:12px;">${wod.date} — ${wod.dayType.charAt(0).toUpperCase() + wod.dayType.slice(1)}</div>`;

  // Body weight log
  const lastWeight = getSettings().bodyWeight;
  const logWeight = log.logBodyWeight || lastWeight;
  html += `<div class="card" style="border-left-color:var(--recovery);margin-bottom:12px;padding:12px 16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--recovery);letter-spacing:1px;">WEIGH-IN</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">Optional — updates your profile</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <input type="number" id="log-bodyweight" value="${logWeight}" style="width:70px;text-align:center;" onchange="updateLogBodyWeight(this.value)">
        <span style="color:var(--text3);font-size:13px;">lb</span>
      </div>
    </div>
  </div>`;

  log.exercises.forEach((ex, i) => {
    const failClass = ex.failed ? 'failed' : (ex.checked ? 'checked' : '');
    html += `<div class="log-item" style="${ex.failed ? 'opacity:0.6;' : ''}">
      <button class="log-check ${failClass}" onclick="toggleLogCheck(${i})">${ex.failed ? '✗' : '✓'}</button>
      <div class="log-exercise">
        <div class="log-exercise-name">${ex.name}</div>
        <div class="log-exercise-detail">${ex.section} — ${ex.prescription}</div>
        ${ex.isMainLift && ex.round ? `<button class="log-fail-btn ${ex.failed ? 'active' : ''}" onclick="toggleFail(${i})">${ex.failed ? 'FAILED' : 'FAIL'}</button>` : ''}
      </div>`;
    if (ex.hasWeight) {
      const isR1MainLift = ex.isMainLift && ex.round === 1;
      html += `<input type="number" class="log-weight-input" value="${ex.weight || ''}" placeholder="lb" onchange="${isR1MainLift ? `autoFillWeights(${i}, this.value)` : `updateLogWeight(${i}, this.value)`}">`;
    }
    if (ex.hasReps) {
      html += `<input type="number" class="log-reps-input" value="${ex.reps || ''}" placeholder="reps" onchange="updateLogReps(${i}, this.value)">`;
    }
    html += '</div>';
  });

  el.innerHTML = html;
}

function buildLogFromWod(wod) {
  const settings = getSettings();
  const exercises = [];

  wod.sections.forEach(section => {
    if (section.type === 'strength') {
      // Main lift with weight per round
      section.weights.forEach((w, i) => {
        exercises.push({
          name: section.mainLift,
          section: 'STRENGTH',
          prescription: `Round ${i+1}: ${w.weight}lb (${w.pct}%) x ${section.reps}`,
          hasWeight: true,
          weight: w.weight,
          hasReps: true,
          reps: section.reps,
          checked: false,
          isMainLift: true,
          liftCategory: section.liftCategory,
          round: i + 1
        });
      });
      // Accessory
      section.accessory.forEach(a => {
        exercises.push({
          name: a.name,
          section: 'STRENGTH',
          prescription: a.reps,
          hasWeight: false, weight: 0,
          hasReps: false, reps: 0,
          checked: false, isMainLift: false
        });
      });
    } else if (section.type === 'strengthcon') {
      section.exercises.forEach(e => {
        exercises.push({
          name: e.name,
          section: 'STRENGTHCON',
          prescription: e.reps,
          hasWeight: e.isBarbell,
          weight: e.weight || 0,
          hasReps: false, reps: 0,
          checked: false, isMainLift: e.isBarbell,
          liftCategory: e.isBarbell ? section.liftCategory : null
        });
      });
    } else if (section.type === 'recovery-cardio') {
      // Zone 2 cardio — logged as a single entry, credits weekly Z2 minutes
      exercises.push({
        name: section.label,
        section: 'ZONE 2',
        prescription: section.format,
        hasWeight: false, weight: 0,
        hasReps: false, reps: 0,
        checked: false, isMainLift: false,
        isCardio: true,
        minutes: section.duration || 30
      });
    } else {
      (section.exercises || []).forEach(e => {
        exercises.push({
          name: e.name,
          section: section.label,
          prescription: e.reps,
          hasWeight: false, weight: 0,
          hasReps: false, reps: 0,
          checked: false, isMainLift: false
        });
      });
    }
  });

  return {
    date: wod.date,
    dayType: wod.dayType,
    rotationIndex: wod.rotationIndex,
    exercises: exercises,
    logBodyWeight: getSettings().bodyWeight
  };
}

function toggleLogCheck(idx) {
  const log = getCurrentLog();
  if (!log) return;
  const ex = log.exercises[idx];
  if (ex.failed) {
    // Clear fail state when clicking check
    ex.failed = false;
    ex.checked = false;
  } else {
    ex.checked = !ex.checked;
  }
  saveCurrentLog(log);
  renderLog();
}

function updateLogWeight(idx, val) {
  const log = getCurrentLog();
  if (!log) return;
  log.exercises[idx].weight = parseInt(val) || 0;
  saveCurrentLog(log);
}

function updateLogReps(idx, val) {
  const log = getCurrentLog();
  if (!log) return;
  log.exercises[idx].reps = parseInt(val) || 0;
  saveCurrentLog(log);
}

function autoFillWeights(startIdx, val) {
  const log = getCurrentLog();
  if (!log) return;
  const startWeight = parseInt(val) || 0;
  if (startWeight <= 0) return;

  const ex = log.exercises[startIdx];
  const liftName = ex.name;

  // Determine jump size based on lift category
  // Squat/Deadlift = bigger jumps, Bench/Press = smaller
  const bigLifts = ['BB Back Squat', 'BB Deadlift', 'BB Front Squat'];
  const jump = bigLifts.includes(liftName) ? 10 : 5;

  // Find all rounds of the same lift
  let roundNum = 0;
  for (let i = startIdx; i < log.exercises.length; i++) {
    const e = log.exercises[i];
    if (e.name === liftName && e.isMainLift && e.round) {
      const w = startWeight + (roundNum * jump);
      e.weight = Math.round(w / 5) * 5; // round to nearest 5
      roundNum++;
    } else if (e.isMainLift && e.name !== liftName) {
      break; // different lift, stop
    }
  }

  saveCurrentLog(log);
  renderLog();
  showToast(`Auto-filled: ${startWeight}lb +${jump}lb/round`);
}

function toggleFail(idx) {
  const log = getCurrentLog();
  if (!log) return;
  const ex = log.exercises[idx];
  if (ex.failed) {
    // Undo fail
    ex.failed = false;
    ex.checked = false;
  } else {
    // Mark failed — still counts as attempted
    ex.failed = true;
    ex.checked = true;
  }
  saveCurrentLog(log);
  renderLog();
}

function updateLogBodyWeight(val) {
  const log = getCurrentLog();
  if (!log) return;
  log.logBodyWeight = parseInt(val) || 0;
  saveCurrentLog(log);
}

function logCurrentWorkout() {
  if (!currentWod) return;

  let log = getCurrentLog();
  if (!log || log.date !== currentWod.date) {
    log = buildLogFromWod(currentWod);
  }

  // Check all exercises as completed — except optional Z2 flush cardio,
  // which only counts if done deliberately (check it in the Log view)
  log.exercises.forEach(e => { e.checked = !(e.isCardio && log.dayType !== 'recovery'); });
  saveCurrentLog(log);

  const entry = persistLogEntry(log);

  // Advance rotation if this was a strength or strengthcon workout
  const hasStrength = currentWod.sections.some(s => s.type === 'strength' || s.type === 'strengthcon');
  if (hasStrength) {
    setRotationIndex(getRotationIndex() + 1);
    setStrengthCount(getStrengthCount() + 1);
  }

  // Clear current wod cache so next generation uses new rotation
  localStorage.removeItem(STORAGE_KEYS.currentWod);
  localStorage.removeItem(STORAGE_KEYS.currentLog);

  setShuffleCount(0); // reset shuffle on log
  syncToGitHub(true);
  switchView('today');
  showWorkoutSummary(entry);
}

// Shared: turn the current log into a history entry (tonnage, Z2, fails → adjustments)
function persistLogEntry(log) {
  const history = getHistory();
  const existIdx = history.findIndex(h => h.date === log.date && h.dayType === log.dayType);
  if (existIdx >= 0) history.splice(existIdx, 1);

  // Zone 2 minutes from checked cardio entries
  let z2Minutes = 0;
  log.exercises.forEach(e => {
    if (e.isCardio && e.checked && e.minutes > 0) z2Minutes += e.minutes;
  });

  const entry = {
    date: log.date,
    dayType: log.dayType,
    rotationIndex: log.rotationIndex,
    exercises: log.exercises,
    bodyWeight: log.logBodyWeight || 0,
    z2Minutes: z2Minutes,
    completedAt: new Date().toISOString()
  };
  history.unshift(entry);
  saveHistory(history);

  // Update body weight in settings if logged
  if (log.logBodyWeight && log.logBodyWeight > 0) {
    const s = getSettings();
    s.bodyWeight = log.logBodyWeight;
    saveSettings(s);
    addWeighIn(log.date, log.logBodyWeight);
  }

  // Autoregulation: fails pull the next session down; clean sessions reset
  updateAdjustmentsFromLog(log);

  // A logged workout satisfies (and clears) the plan
  const p = getPlannedNext();
  if (p && p.date && p.date <= log.date) savePlannedNext(null);

  return entry;
}

function updateAdjustmentsFromLog(log) {
  const adj = getAdjustments();
  let changed = false;
  const byKey = {};
  log.exercises.forEach(e => {
    if (e.isMainLift && e.round) {
      const rx = LOADING_RX[e.name];
      const key = rx ? rx.oneRMKey : null;
      if (!key) return;
      if (!byKey[key]) byKey[key] = { failed: 0, attempted: 0 };
      if (e.checked) byKey[key].attempted++;
      if (e.failed) byKey[key].failed++;
    }
  });
  Object.keys(byKey).forEach(key => {
    if (byKey[key].failed > 0) {
      adj[key] = 0.925;
      changed = true;
    } else if (byKey[key].attempted > 0 && adj[key]) {
      delete adj[key];
      changed = true;
    }
  });
  if (changed) saveAdjustments(adj);
}

function skipWorkout() {
  setShuffleCount(getShuffleCount() + 1);
  localStorage.removeItem(STORAGE_KEYS.currentWod);
  localStorage.removeItem(STORAGE_KEYS.currentLog);
  renderToday();
  showToast('Shuffled — new workout generated');
}

// ============================================================
// INLINE WEIGHT EDITING — the rec is a starting point, not a command
// ============================================================

function bumpWeight(si, i, delta) {
  if (!currentWod || !currentWod.sections[si] || !currentWod.sections[si].weights) return;
  const w = currentWod.sections[si].weights[i];
  setRoundWeight(si, i, Math.max(0, (w.weight || 0) + delta));
}

function setWeightManual(si, i, val) {
  const n = parseInt(val, 10);
  if (isNaN(n) || n < 0) { renderWodContent(currentWod); return; }
  setRoundWeight(si, i, n);
}

function setRoundWeight(si, i, newWeight) {
  const section = currentWod.sections[si];
  const w = section.weights[i];
  if (w.orig === undefined) w.orig = { weight: w.weight, pct: w.pct };
  w.weight = newWeight;
  w.edited = (newWeight !== w.orig.weight);
  if (!w.edited) { w.pct = w.orig.pct; delete w.orig; }
  else if (section.oneRM > 0) w.pct = Math.round(newWeight / section.oneRM * 100);
  refreshHerniaFlags(section);
  saveCurrentWod(currentWod);
  syncLogRoundWeight(section, i);
  renderWodContent(currentWod);
}

function resetWeights(si) {
  const section = currentWod.sections[si];
  section.weights.forEach((w, i) => {
    if (w.orig !== undefined) {
      w.weight = w.orig.weight;
      w.pct = w.orig.pct;
      delete w.orig;
      w.edited = false;
      syncLogRoundWeight(section, i);
    }
  });
  refreshHerniaFlags(section);
  saveCurrentWod(currentWod);
  renderWodContent(currentWod);
  showToast('Back to the plan');
}

function refreshHerniaFlags(section) {
  if (!section.mainLift || section.oneRM <= 0) return;
  const settings = getSettings();
  section.herniaFlags = [];
  section.weights.forEach((w, idx) => {
    if (isHerniaFlagged(section.mainLift, w.pct, settings)) section.herniaFlags.push(idx);
  });
}

function syncLogRoundWeight(section, i) {
  const log = getCurrentLog();
  if (!log || log.date !== currentWod.date || log.dayType !== currentWod.dayType) return;
  const w = section.weights[i];
  const entry = log.exercises.find(e => e.isMainLift && e.round === i + 1 && e.name === section.mainLift);
  if (entry) {
    entry.weight = w.weight;
    entry.prescription = `Round ${i+1}: ${w.weight}lb (${w.pct}%) x ${section.reps}`;
    saveCurrentLog(log);
  }
}

// Strengthcon barbell station load
function bumpStationWeight(si, ei, delta) {
  if (!currentWod || !currentWod.sections[si] || !currentWod.sections[si].exercises) return;
  const e = currentWod.sections[si].exercises[ei];
  setStationWeight(si, ei, Math.max(0, (e.weight || 0) + delta));
}

function setStationWeightManual(si, ei, val) {
  const n = parseInt(val, 10);
  if (isNaN(n) || n < 0) { renderWodContent(currentWod); return; }
  setStationWeight(si, ei, n);
}

function setStationWeight(si, ei, newWeight) {
  const section = currentWod.sections[si];
  const e = section.exercises[ei];
  if (e.origWeight === undefined) e.origWeight = { weight: e.weight, pct: e.pct, reps: e.reps };
  const oldReps = e.reps;
  e.weight = newWeight;
  e.edited = (newWeight !== e.origWeight.weight);
  if (!e.edited) {
    e.pct = e.origWeight.pct;
    e.reps = e.origWeight.reps;
    delete e.origWeight;
  } else {
    const rx = LOADING_RX[e.name];
    const oneRM = rx && rx.oneRMKey ? (getSettings().oneRM[rx.oneRMKey] || 0) : 0;
    e.pct = oneRM > 0 ? Math.round(newWeight / oneRM * 100) : e.pct;
    const baseReps = parseInt(e.reps, 10) || (rx ? rx.reps : 8);
    e.reps = `${baseReps} @ ${newWeight}lb${oneRM > 0 ? ` (${e.pct}%)` : ''}`;
  }
  saveCurrentWod(currentWod);
  // Sync in-progress log entry
  const log = getCurrentLog();
  if (log && log.date === currentWod.date && log.dayType === currentWod.dayType) {
    const entry = log.exercises.find(x => x.isMainLift && x.name === e.name && x.prescription === oldReps);
    if (entry) { entry.weight = e.weight; entry.prescription = e.reps; saveCurrentLog(log); }
  }
  renderWodContent(currentWod);
}

function resetStationWeight(si, ei) {
  const e = currentWod.sections[si].exercises[ei];
  if (e.origWeight !== undefined) setStationWeight(si, ei, e.origWeight.weight);
}

// ============================================================
// PER-EXERCISE SWAP
// ============================================================

function swapPoolFor(sectionType) {
  const settings = getSettings();
  const eq = settings.equipment;
  if (sectionType === 'power') return POWER_MOVES.map(m => m.name);
  if (sectionType === 'warmup') return WARMUP_DYNAMIC.slice();
  if (sectionType === 'recovery-warmup') return RECOVERY_MOBILITY.slice();
  if (sectionType === 'core') return filterForEquipment(EXERCISES.core, eq);
  if (sectionType === 'glute') return filterForEquipment(EXERCISES.glute, eq);
  // metcon / hiit / strengthcon: the whole movement library, equipment-filtered
  const pool = [].concat(
    EXERCISES.push, EXERCISES.pull, EXERCISES.squat,
    EXERCISES.hinge, EXERCISES.core, EXERCISES.metcon_combo, EXERCISES.conditioning
  );
  return filterForEquipment([...new Set(pool)], eq);
}

function swapExercise(si, ei) {
  if (!currentWod || !currentWod.sections[si] || !currentWod.sections[si].exercises) return;
  const section = currentWod.sections[si];
  const ex = section.exercises[ei];
  if (!ex || ex.isBarbell) return;

  const settings = getSettings();
  const inUse = section.exercises.map(e => e.name);
  const candidates = swapPoolFor(section.type)
    .map(n => applyEquipSubs(n, settings.equipment))
    .filter(n => !inUse.includes(n))
    .filter(n => !(settings.herniaMode && isHerniaFlagged(n, 100, settings)));
  if (candidates.length === 0) { showToast('No substitute available'); return; }

  const oldName = ex.name;
  ex.name = candidates[Math.floor(Math.random() * candidates.length)];

  // Power section: swap the whole prescription, not just the name
  if (section.type === 'power') {
    const move = POWER_MOVES.find(m => m.name === ex.name);
    if (move) {
      ex.reps = move.rx;
      section.format = move.rx + ' — FULL rest between sets';
    }
  }

  saveCurrentWod(currentWod);

  // Keep an in-progress log in sync
  const log = getCurrentLog();
  if (log && log.date === currentWod.date && log.dayType === currentWod.dayType) {
    const entry = log.exercises.find(e => e.name === oldName && e.section === section.label && !e.checked);
    if (entry) { entry.name = ex.name; saveCurrentLog(log); }
  }

  renderWodContent(currentWod);
  showToast(`${oldName} → ${ex.name}`);
}

function swapAccessory(si, ai) {
  if (!currentWod || !currentWod.sections[si] || !currentWod.sections[si].accessory) return;
  const section = currentWod.sections[si];
  const acc = section.accessory[ai];
  if (!acc) return;

  const settings = getSettings();
  const liftCat = section.liftCategory;
  const pool = liftCat === 'squat' ? EXERCISES.squat :
               liftCat === 'bench' ? EXERCISES.push :
               liftCat === 'deadlift' ? EXERCISES.hinge :
               EXERCISES.push;
  const inUse = section.accessory.map(e => e.name);
  const candidates = filterForEquipment(pool, settings.equipment)
    .map(n => applyEquipSubs(n, settings.equipment))
    .filter(n => !inUse.includes(n))
    .filter(n => !(settings.herniaMode && isHerniaFlagged(n, 100, settings)));
  if (candidates.length === 0) { showToast('No substitute available'); return; }

  const oldName = acc.name;
  acc.name = candidates[Math.floor(Math.random() * candidates.length)];
  saveCurrentWod(currentWod);

  const log = getCurrentLog();
  if (log && log.date === currentWod.date && log.dayType === currentWod.dayType) {
    const entry = log.exercises.find(e => e.name === oldName && e.section === 'STRENGTH' && !e.isMainLift && !e.checked);
    if (entry) { entry.name = acc.name; saveCurrentLog(log); }
  }

  renderWodContent(currentWod);
  showToast(`${oldName} → ${acc.name}`);
}

function saveLog() {
  const log = getCurrentLog();
  if (!log) return;

  const entry = persistLogEntry(log);

  // Check if enough main lifts were done to advance rotation
  const mainLifts = log.exercises.filter(e => e.isMainLift && e.checked);
  if (mainLifts.length > 0) {
    const hasStrength = currentWod && currentWod.sections.some(s => s.type === 'strength' || s.type === 'strengthcon');
    if (hasStrength) {
      setRotationIndex(getRotationIndex() + 1);
      setStrengthCount(getStrengthCount() + 1);
      localStorage.removeItem(STORAGE_KEYS.currentWod);
    }
  }

  // Auto-sync to GitHub if token configured
  syncToGitHub(true);

  showWorkoutSummary(entry);
}

// ============================================================
// POST-WORKOUT SUMMARY — the moment that builds the habit
// ============================================================

let summaryEntryKey = null;

function showWorkoutSummary(entry) {
  const history = getHistory();
  const settings = getSettings();
  const el = document.getElementById('summary-content');
  summaryEntryKey = { date: entry.date, dayType: entry.dayType };

  const checked = entry.exercises.filter(e => e.checked);
  const totalSets = entry.exercises.length;
  let tonnage = 0;
  checked.forEach(e => {
    if (e.weight > 0 && e.reps > 0) tonnage += e.weight * e.reps;
  });

  const streaks = computeStreaks(history);
  const stats = computeWeekStats(history);

  const emojiMap = { weekday: '💪', saturday: '🏋️', sunday: '⚡', recovery: '🧘' };
  const dayLabels = { weekday: 'Weekday', saturday: 'Saturday', sunday: 'Sunday', recovery: 'Recovery' };

  let html = `<div class="summary-hero">
    <div class="summary-emoji">${emojiMap[entry.dayType] || '💪'}</div>
    <div class="summary-title">${entry.dayType === 'recovery' ? 'Recovery Banked' : 'Workout Logged'}</div>
    <div class="summary-sub">${formatHistoryDate(entry.date)} — ${dayLabels[entry.dayType] || ''} · Workout #${history.length}</div>
  </div>`;

  html += `<div class="summary-stats">
    <div class="summary-stat"><div class="stat-value">${tonnage > 0 ? tonnage.toLocaleString() : '—'}</div><div class="stat-label">Tonnage (lb)</div></div>
    <div class="summary-stat"><div class="stat-value">${checked.length}/${totalSets}</div><div class="stat-label">Sets Done</div></div>
    <div class="summary-stat"><div class="stat-value">🔥 ${streaks.current}</div><div class="stat-label">Week Streak</div></div>
    <div class="summary-stat"><div class="stat-value">${entry.dayType === 'recovery' && entry.z2Minutes > 0 ? entry.z2Minutes + '′' : history.length}</div><div class="stat-label">${entry.dayType === 'recovery' && entry.z2Minutes > 0 ? 'Zone 2 Min' : 'Total Workouts'}</div></div>
  </div>`;

  // Main-lift performance: e1RM, PR detection, 1RM update prompt
  const liftNames = [...new Set(entry.exercises.filter(e => e.isMainLift && e.round).map(e => e.name))];
  liftNames.forEach(lift => {
    const todayE1 = entryE1RM(entry, lift);
    if (todayE1 <= 0) return;

    // Best prior e1RM (excluding today's entry)
    let priorBest = 0;
    history.forEach(h => {
      if (h.date === entry.date && h.dayType === entry.dayType) return;
      const est = entryE1RM(h, lift);
      if (est > priorBest) priorBest = est;
    });

    const rx = LOADING_RX[lift];
    const key = rx ? rx.oneRMKey : null;
    const stored = key ? (settings.oneRM[key] || 0) : 0;
    const isPR = priorBest > 0 && todayE1 > priorBest;
    const firstBench = priorBest === 0;

    html += `<div class="summary-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-weight:700;font-size:15px;">${lift}</div>
        ${isPR ? '<span class="pr-badge">★ NEW e1RM PR</span>' : ''}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:4px 0;">
        <span>Today's est. 1RM</span><span style="font-weight:800;color:var(--text);font-size:15px;">${todayE1} lb</span>
      </div>
      ${priorBest > 0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:4px 0;"><span>Previous best</span><span style="font-weight:600;">${priorBest} lb ${isPR ? `<span style="color:var(--success);">+${todayE1 - priorBest}</span>` : ''}</span></div>` : ''}
      ${firstBench ? `<div style="font-size:12px;color:var(--text3);padding:4px 0;">First tracked session — this is your benchmark.</div>` : ''}
      ${(() => {
        // Training-max model: updates capped at +2.5% per session so one
        // enthusiastic day can't inflate next month's percentages
        if (!key || stored <= 0 || todayE1 <= stored) return '';
        const suggested = Math.min(roundTo5(todayE1), roundTo5(stored * 1.025));
        if (suggested <= stored) return '';
        const capped = suggested < todayE1;
        return `<button class="btn btn-primary btn-sm" style="margin-top:10px;width:100%;" id="update-1rm-${key}" onclick="applyOneRMUpdate('${key}', ${suggested}, '${lift.replace(/'/g, "\\'")}')">UPDATE 1RM: ${stored} → ${suggested} LB</button>` +
          (capped ? `<div style="font-size:11px;color:var(--text3);margin-top:4px;text-align:center;">Capped at +2.5%/session — steady beats spiky. Benchmark days re-validate the rest.</div>` : '');
      })()}
    </div>`;
  });

  // Week goals
  html += `<div class="summary-card" style="border-left-color:var(--core);">
    <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;">This Week</div>
    <div class="week-goals" style="margin-top:0;">
      <div class="week-goal ${stats.active >= 3 ? 'hit' : ''}"><div class="week-goal-dot"></div>${stats.active}/3 Active</div>
      <div class="week-goal ${stats.intense >= 3 ? 'hit' : ''}"><div class="week-goal-dot"></div>${stats.intense}/3 Intense</div>
      <div class="week-goal ${stats.z2 >= (settings.z2Target || 90) ? 'hit' : ''}"><div class="week-goal-dot"></div>${stats.z2}/${settings.z2Target || 90} Z2</div>
    </div>
    ${stats.active === 2 ? '<div style="font-size:12px;color:var(--text2);margin-top:8px;">One more and the week is yours.</div>' : ''}
    ${stats.active >= 3 && stats.intense >= 3 ? '<div style="font-size:12px;color:var(--success);margin-top:8px;">Week goals hit. This is just what you do now.</div>' : ''}
  </div>`;

  // Pain check — the most important datapoint after "did you show up".
  // Feeds hernia-phase progression and future exercise exclusions.
  html += `<div class="summary-card" style="border-left-color:var(--recovery);">
    <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;">Body Check</div>
    <div style="font-size:13px;color:var(--text2);">Any pain or pull today (hernia site or otherwise)?</div>
    <div class="plan-chips" id="pain-chips">
      <button class="plan-chip" onclick="recordPain('none', this)">✓ None</button>
      <button class="plan-chip" onclick="recordPain('twinge', this)">Twinge</button>
      <button class="plan-chip" onclick="recordPain('pain', this)">Real Pain</button>
    </div>
    <div id="pain-feedback" style="font-size:12px;color:var(--text3);margin-top:8px;"></div>
  </div>`;

  // Implementation intention: lock in the next session while motivation is high
  const nextLiftCat = LIFT_ROTATION[getRotationIndex()];
  const nextFocus = nextLiftCat.charAt(0).toUpperCase() + nextLiftCat.slice(1) + ' day';
  html += `<div class="summary-card" style="border-left-color:var(--strengthcon);">
    <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;">Next Up: ${nextFocus}</div>
    <div style="font-size:13px;color:var(--text2);">When's the next one? Deciding now doubles the odds you show up.</div>
    <div class="plan-chips" id="plan-chips">
      <button class="plan-chip" onclick="planNext(1, 'AM', '${nextFocus}', this)">Tomorrow AM</button>
      <button class="plan-chip" onclick="planNext(1, 'PM', '${nextFocus}', this)">Tomorrow PM</button>
      <button class="plan-chip" onclick="planNext(2, '', '${nextFocus}', this)">In 2 Days</button>
    </div>
  </div>`;

  el.innerHTML = html;
  document.getElementById('summary-overlay').classList.add('active');
  document.getElementById('summary-overlay').scrollTop = 0;
}

// Pain logging → hernia-phase progression (graded exposure, not guesswork)
function recordPain(level, btn) {
  if (!summaryEntryKey) return;

  const history = getHistory();
  const entry = history.find(h => h.date === summaryEntryKey.date && h.dayType === summaryEntryKey.dayType);
  if (entry) {
    entry.painLevel = level;
    saveHistory(history);
  }

  document.querySelectorAll('#pain-chips .plan-chip').forEach(b => b.classList.remove('selected'));
  if (btn) btn.classList.add('selected');

  const s = getSettings();
  const fb = document.getElementById('pain-feedback');
  const CLEAN_TARGET = 8;

  if (level === 'none') {
    if (s.herniaMode && (s.herniaPhase || 1) < 3) {
      s.herniaCleanCount = (s.herniaCleanCount || 0) + 1;
      if (s.herniaCleanCount >= CLEAN_TARGET) {
        if (fb) fb.innerHTML = `<span style="color:var(--success);">${s.herniaCleanCount} clean sessions — you're eligible for Hernia Phase ${(s.herniaPhase || 1) + 1}. Advance it in Settings (worth a quick OK from your doctor first).</span>`;
      } else {
        if (fb) fb.textContent = `Clean session ${s.herniaCleanCount}/${CLEAN_TARGET} toward Phase ${(s.herniaPhase || 1) + 1}.`;
      }
    } else {
      if (fb) fb.textContent = 'Noted — all clear.';
    }
  } else if (level === 'twinge') {
    if (fb) fb.textContent = 'Noted. A twinge is information, not a verdict — watch it next session, and swap anything that provokes it.';
  } else {
    if (s.herniaMode) s.herniaCleanCount = 0;
    if (fb) fb.innerHTML = '<span style="color:var(--caution);">Logged. Back off the aggravating movement, and if this repeats or worsens, get it checked before loading again.</span>';
  }
  saveSettings(s);
  syncToGitHub(true);
}

function planNext(daysAhead, time, focus, btn) {
  const d = new Date(todayStr() + 'T12:00:00');
  d.setDate(d.getDate() + daysAhead);
  savePlannedNext({ date: localDateStr(d), time: time, focus: focus });
  document.querySelectorAll('#plan-chips .plan-chip').forEach(b => b.classList.remove('selected'));
  if (btn) btn.classList.add('selected');
  showToast('Locked in 📅');
}

function applyOneRMUpdate(key, newVal, liftName) {
  const s = getSettings();
  s.oneRM[key] = newVal;
  saveSettings(s);
  localStorage.removeItem(STORAGE_KEYS.currentWod);
  localStorage.removeItem(STORAGE_KEYS.currentLog);
  const btn = document.getElementById('update-1rm-' + key);
  if (btn) { btn.textContent = '✓ 1RM UPDATED — ' + newVal + ' LB'; btn.disabled = true; btn.style.opacity = '0.6'; }
  showToast(liftName + ' 1RM → ' + newVal + ' lb');
  syncToGitHub(true);
}

function closeSummary() {
  document.getElementById('summary-overlay').classList.remove('active');
  switchView('today');
}

// ============================================================
// HISTORY VIEW
// ============================================================

function renderHistory() {
  const el = document.getElementById('history-content');
  const history = getHistory();

  if (history.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">No workouts logged yet</div></div>';
    return;
  }

  // Show lift progression summary
  let html = '<div class="card" style="border-left-color:var(--strength);">';
  html += '<div class="card-label label-strength">LIFT PROGRESSION</div>';

  // Every main lift that appears in history (variants included), else the big four
  const liftSet = new Set();
  history.forEach(h => (h.exercises || []).forEach(e => {
    if (e.isMainLift && e.round && e.checked && e.weight > 0) liftSet.add(e.name);
  }));
  const liftNames = liftSet.size > 0
    ? Array.from(liftSet).sort()
    : ['BB Back Squat', 'BB Bench Press', 'BB Deadlift', 'BB Push Press'];
  let anyLift = false;
  liftNames.forEach(lift => {
    // e1RM trend per session (oldest → newest)
    const series = [];
    history.slice().reverse().forEach(h => {
      const est = entryE1RM(h, lift);
      if (est > 0) series.push(est);
    });
    if (series.length > 0) {
      anyLift = true;
      const recent = series.slice(-8);
      const last = recent[recent.length - 1];
      const delta = recent.length > 1 ? last - recent[0] : 0;
      const deltaHtml = (recent.length > 1 && delta !== 0)
        ? `<span class="spark-delta" style="color:${delta > 0 ? 'var(--success)' : 'var(--text3)'};">${delta > 0 ? '+' : ''}${delta}</span>`
        : '';
      html += `<div class="spark-row">
        <span class="spark-label">${lift}</span>
        ${sparkline(recent, 'var(--strength)')}
        <span class="spark-value">e1RM ${last}${deltaHtml}</span>
      </div>`;
    }
  });
  if (!anyLift) {
    html += '<div style="font-size:13px;color:var(--text3);padding:8px 0;">Log main-lift weights and reps to see your estimated-1RM trend here.</div>';
  }

  html += '<div style="margin-top:12px;">';
  html += '<div class="rotation-indicator">';
  const ridx = getRotationIndex();
  const labels = ['SQ', 'BN', 'DL', 'PR'];
  LIFT_ROTATION.forEach((_, i) => {
    const cls = i === ridx ? 'active' : '';
    html += `<div class="rotation-dot ${cls}"></div>`;
  });
  html += `<span class="rotation-label">Current: ${labels[ridx]}</span>`;
  html += '</div></div></div>';

  // Body weight trend (no BMI — it punishes muscle on a lifter; the trend
  // line plus lift performance tells the real story)
  const settings = getSettings();
  const allWeights = weightSeries();
  const weightEntries = allWeights.slice(-14);
  if (weightEntries.length > 0 || settings.bodyWeight > 0) {
    html += '<div class="card" style="border-left-color:var(--recovery);margin-top:12px;">';
    html += '<div class="card-label label-recovery">BODY WEIGHT</div>';
    const series = weightEntries.map(w => w.weight);
    if (series.length > 1) {
      const diff = Math.round((series[series.length - 1] - series[0]) * 10) / 10;
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      html += `<div class="spark-row">
        <span class="spark-label">${settings.bodyWeight} lb</span>
        ${sparkline(series, 'var(--recovery)')}
        <span class="spark-value" style="color:var(--text2);">${arrow} ${Math.abs(diff)} lb / ${series.length} logs</span>
      </div>`;
    } else {
      html += `<div style="display:flex;justify-content:space-between;padding:8px 0;">
        <span style="color:var(--text2);">Current Weight</span>
        <span style="font-weight:700;">${settings.bodyWeight} lb</span>
      </div>`;
    }
    html += '</div>';
  }

  // Weekly Volume (last 4 weeks)
  const fourWeeksAgo = new Date();
  fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
  const fourWeeksStr = fourWeeksAgo.toISOString().slice(0, 10);
  const recentHistory = history.filter(h => h.date >= fourWeeksStr);
  if (recentHistory.length > 0) {
    // Group by week
    const weeks = {};
    recentHistory.forEach(h => {
      const d = new Date(h.date + 'T12:00:00');
      const dow = d.getDay();
      const mon = new Date(d);
      mon.setDate(d.getDate() - ((dow + 6) % 7));
      const weekKey = localDateStr(mon);
      if (!weeks[weekKey]) weeks[weekKey] = { workouts: 0, tonnage: 0, sets: 0 };
      weeks[weekKey].workouts++;
      h.exercises.filter(e => e.checked).forEach(e => {
        weeks[weekKey].sets++;
        if (e.weight > 0 && e.reps > 0) {
          weeks[weekKey].tonnage += e.weight * e.reps;
        }
      });
    });

    html += '<div class="card" style="border-left-color:var(--core);margin-top:12px;">';
    html += '<div class="card-label label-core">WEEKLY VOLUME</div>';
    const tonnageSeries = Object.keys(weeks).sort().map(k => weeks[k].tonnage);
    if (tonnageSeries.length > 1 && tonnageSeries.some(t => t > 0)) {
      html += `<div style="padding:4px 0 8px;">${sparkline(tonnageSeries, 'var(--core)', 260, 32)}</div>`;
    }
    Object.keys(weeks).sort().reverse().forEach(weekKey => {
      const w = weeks[weekKey];
      const weekDate = new Date(weekKey + 'T12:00:00');
      const label = weekDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3);">
        <div>
          <div style="font-weight:600;font-size:13px;">Wk of ${label}</div>
          <div style="font-size:11px;color:var(--text3);">${w.workouts} workout${w.workouts > 1 ? 's' : ''} · ${w.sets} sets</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;font-size:14px;">${w.tonnage > 0 ? (w.tonnage / 1000).toFixed(1) + 'k' : '—'}</div>
          <div style="font-size:10px;color:var(--text3);">lb tonnage</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  // Streak Counter (with monthly shield)
  if (history.length > 0) {
    const streaks = computeStreaks(history);
    html += '<div class="card" style="border-left-color:var(--strength);margin-top:12px;">';
    html += '<div class="card-label label-strength">CONSISTENCY</div>';
    html += `<div style="display:flex;justify-content:space-between;padding:8px 0;">
      <span style="color:var(--text2);">Week Streak (3+ workouts)</span>
      <span style="font-weight:700;font-size:18px;">🔥 ${streaks.current} ${streaks.current === 1 ? 'week' : 'weeks'}</span>
    </div>`;
    html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bg3);">
      <span style="color:var(--text2);">Best Streak</span>
      <span style="font-weight:700;">${streaks.best} ${streaks.best === 1 ? 'week' : 'weeks'}</span>
    </div>`;
    html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bg3);">
      <span style="color:var(--text2);">Total Workouts</span>
      <span style="font-weight:700;">${history.length}</span>
    </div>`;
    html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bg3);">
      <span style="color:var(--text2);">Streak Shield</span>
      <span style="font-weight:600;font-size:13px;color:var(--text3);">${streaks.shieldAvailable ? '🛡 Ready — one missed week/month forgiven' : '🛡 Used this month'}</span>
    </div>`;
    html += '</div>';
  }

  // Past workouts
  html += '<div style="margin-top:16px;font-size:13px;color:var(--text3);font-weight:600;margin-bottom:8px;">PAST WORKOUTS</div>';

  history.forEach((h, i) => {
    const dayColors = { weekday: 'var(--strength)', saturday: 'var(--strengthcon)', sunday: 'var(--hiit)', recovery: 'var(--recovery)' };
    const dayLabels = { weekday: 'WEEKDAY', saturday: 'SATURDAY', sunday: 'SUNDAY', recovery: 'RECOVERY' };
    const completed = h.exercises.filter(e => e.checked).length;
    const total = h.exercises.length;

    html += `<div class="history-item">
      <div class="history-header" onclick="toggleHistory(${i})">
        <div>
          <div class="history-date">${formatHistoryDate(h.date)}</div>
          <div style="font-size:12px;color:var(--text3);">${completed}/${total} exercises</div>
        </div>
        <span class="history-type" style="background:${dayColors[h.dayType]};color:#fff;">${dayLabels[h.dayType]}</span>
      </div>
      <div class="history-detail" id="history-detail-${i}">`;

    h.exercises.filter(e => e.checked).forEach(e => {
      html += `<div class="history-exercise">
        <span class="history-exercise-name">${e.name}</span>
        <span class="history-exercise-weight">${e.weight > 0 ? e.weight + ' lb' : ''}${e.reps > 0 ? ' x ' + e.reps : ''}</span>
      </div>`;
    });

    html += '</div></div>';
  });

  el.innerHTML = html;
}

function formatHistoryDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function toggleHistory(idx) {
  const el = document.getElementById('history-detail-' + idx);
  if (el) el.classList.toggle('open');
}

}

function set1RM(key, val) {

  localStorage.removeItem(STORAGE_KEYS.currentWod);
  localStorage.removeItem(STORAGE_KEYS.currentLog);

function setSetting(key, val) {
