<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FitBy50</title>
<style>
:root {
  --bg: #0D0D0F;
  --bg2: #16161A;
  --bg3: #1E1E24;
  --bg4: #26262E;
  --text: #E8E6DF;
  --text2: #A09E97;
  --text3: #6B6966;
  --warmup: #4A90D9;
  --strength: #7F77DD;
  --core: #E9A84C;
  --metcon: #D85A30;
  --strengthcon: #1D9E75;
  --hiit: #E24B4A;
  --recovery: #5BB89A;
  --caution: #E89A3C;
  --success: #34C759;
  --danger: #FF3B30;
  --radius: 12px;
  --radius-sm: 8px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button {
  font-family: inherit; font-size: inherit; border: none;
  cursor: pointer; -webkit-appearance: none;
  touch-action: manipulation;
}
input {
  font-family: inherit; font-size: inherit;
  background: var(--bg3); color: var(--text);
  border: 1px solid var(--bg4); border-radius: var(--radius-sm);
  padding: 10px 12px;
  width: 100%;
}
input:focus { outline: none; border-color: var(--strength); }
input[type="number"] { width: 90px; text-align: center; }

/* Layout */
.app { height: 100%; display: flex; flex-direction: column; }
.view {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 16px calc(var(--nav-h) + var(--safe-b) + 16px);
  display: none;
  -webkit-overflow-scrolling: touch;
}
.view.active { display: block; }

/* Bottom Nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--bg2);
  border-top: 1px solid var(--bg3);
  display: flex; z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  background: none; color: var(--text3);
  font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
  text-transform: uppercase; transition: color 0.15s;
  padding: 8px 0;
}
.nav-btn.active { color: var(--strength); }
.nav-btn svg { width: 24px; height: 24px; }

/* Header */
.view-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding: 4px 0;
}
.view-title {
  font-size: 24px; font-weight: 800;
  letter-spacing: -0.5px;
}
.brand { color: var(--strength); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; }

/* Cards */
.card {
  background: var(--bg2); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  border-left: 4px solid var(--bg4);
}
.card-warmup { border-left-color: var(--warmup); }
.card-strength { border-left-color: var(--strength); }
.card-core { border-left-color: var(--core); }
.card-metcon { border-left-color: var(--metcon); }
.card-strengthcon { border-left-color: var(--strengthcon); }
.card-hiit { border-left-color: var(--hiit); }
.card-recovery { border-left-color: var(--recovery); }

.card-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; margin-bottom: 8px;
}
.label-warmup { color: var(--warmup); }
.label-strength { color: var(--strength); }
.label-core { color: var(--core); }
.label-metcon { color: var(--metcon); }
.label-strengthcon { color: var(--strengthcon); }
.label-hiit { color: var(--hiit); }
.label-recovery { color: var(--recovery); }

.card-title {
  font-size: 17px; font-weight: 700; margin-bottom: 4px;
}
.card-meta {
  font-size: 13px; color: var(--text2); margin-bottom: 10px;
}
.exercise-list { list-style: none; }
.exercise-list li {
  padding: 6px 0; font-size: 15px;
  border-bottom: 1px solid var(--bg3);
  display: flex; align-items: center; gap: 8px;
}
.exercise-list li:last-child { border-bottom: none; }
.exercise-rep { color: var(--text2); font-size: 13px; margin-left: auto; white-space: nowrap; }

/* Weight table */
.weight-table {
  width: 100%; border-collapse: collapse;
  margin: 8px 0; font-size: 14px;
}
.weight-table th {
  text-align: left; color: var(--text3); font-weight: 600;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 4px 8px;
}
.weight-table td {
  padding: 6px 8px; border-bottom: 1px solid var(--bg3);
}
.weight-table td:nth-child(2) { font-weight: 700; color: var(--strength); }

/* Caution badge */
.caution-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(232,154,60,0.15); color: var(--caution);
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: 4px; letter-spacing: 0.5px;
}
.caution-badge::before { content: '⚠'; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 48px; padding: 12px 20px;
  border-radius: var(--radius-sm); font-weight: 700;
  font-size: 15px; transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-primary { background: var(--strength); color: #fff; }
.btn-warmup { background: var(--warmup); color: #fff; }
.btn-strength { background: var(--strength); color: #fff; }
.btn-core { background: var(--core); color: #fff; }
.btn-metcon { background: var(--metcon); color: #fff; }
.btn-strengthcon { background: var(--strengthcon); color: #fff; }
.btn-hiit { background: var(--hiit); color: #fff; }
.btn-recovery { background: var(--recovery); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost {
  background: transparent; color: var(--text2);
  border: 1px solid var(--bg4);
}
.btn-sm { min-height: 40px; font-size: 13px; padding: 8px 14px; width: auto; }

/* Day selector */
.day-selector {
  display: flex; gap: 6px; margin-bottom: 16px;
}
.day-btn {
  flex: 1; padding: 10px 4px; border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text2);
  font-size: 12px; font-weight: 600; text-align: center;
  transition: all 0.15s;
}
.day-btn.active { background: var(--strength); color: #fff; }

/* Equipment badge */
.equip-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px;
  font-weight: 600; background: var(--bg3); color: var(--text2);
}
.equip-badge.home { border: 1px solid var(--core); color: var(--core); }
.equip-badge.ymca { border: 1px solid var(--warmup); color: var(--warmup); }

/* Rotation indicator */
.rotation-indicator {
  display: flex; gap: 4px; align-items: center;
  margin: 8px 0;
}
.rotation-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--bg4); transition: all 0.2s;
}
.rotation-dot.active { background: var(--strength); width: 28px; border-radius: 5px; }
.rotation-dot.completed { background: var(--text3); }
.rotation-label { font-size: 12px; color: var(--text3); margin-left: 8px; }

/* Timer overlay */
.timer-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px;
}
.timer-overlay.active { display: flex; }
.timer-phase {
  font-size: 18px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: 8px;
}
.timer-phase.work { color: var(--success); }
.timer-phase.rest { color: var(--danger); }
.timer-phase.get-ready { color: var(--core); }
.timer-digits {
  font-size: 96px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -2px; line-height: 1;
  margin-bottom: 12px;
}
.timer-round {
  font-size: 20px; color: var(--text2); font-weight: 600;
  margin-bottom: 32px;
}
.timer-progress {
  width: 100%; max-width: 300px; height: 6px;
  background: var(--bg3); border-radius: 3px;
  margin-bottom: 40px; overflow: hidden;
}
.timer-progress-bar {
  height: 100%; border-radius: 3px;
  transition: width 0.3s linear;
}
.timer-controls { display: flex; gap: 16px; }
.timer-btn {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
.timer-btn-pause { background: var(--bg3); color: var(--text); }
.timer-btn-stop { background: var(--danger); color: #fff; }
.timer-label {
  font-size: 14px; color: var(--text3); margin-top: 4px; text-align: center;
}
.timer-info {
  font-size: 14px; color: var(--text3); margin-bottom: 16px;
}
.timer-exercise-name {
  font-size: 24px; font-weight: 800; color: var(--text);
  margin-bottom: 4px; text-align: center;
}
.timer-exercise-rep {
  font-size: 14px; color: var(--text3); margin-bottom: 12px;
}
.timer-exercise-list {
  width: 100%; max-width: 320px; margin-bottom: 16px;
  max-height: 160px; overflow-y: auto;
}
.timer-exercise-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 12px; font-size: 13px; border-radius: 6px; margin-bottom: 2px;
}
.timer-exercise-item.current {
  background: rgba(255,255,255,0.08); font-weight: 700; color: var(--text);
}
.timer-exercise-item.done {
  color: var(--text3); text-decoration: line-through; opacity: 0.5;
}
.timer-exercise-item .ex-reps {
  color: var(--text3); font-size: 12px;
}

/* Log view */
.log-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; background: var(--bg2);
  border-radius: var(--radius-sm); margin-bottom: 8px;
}
.log-check {
  width: 28px; height: 28px; border-radius: 6px;
  border: 2px solid var(--bg4); background: none;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: transparent; font-size: 16px;
  transition: all 0.15s;
}
.log-check.checked {
  background: var(--success); border-color: var(--success); color: #fff;
}
.log-check.failed {
  background: var(--danger); border-color: var(--danger); color: #fff;
}
.log-fail-btn {
  font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
  padding: 4px 8px; border-radius: 4px; background: none;
  color: var(--text3); border: 1px solid var(--bg4); margin-top: 4px;
  transition: all 0.15s;
}
.log-fail-btn.active {
  background: rgba(255,59,48,0.15); color: var(--danger); border-color: var(--danger);
}
.log-exercise { flex: 1; }
.log-exercise-name { font-size: 15px; font-weight: 600; }
.log-exercise-detail { font-size: 12px; color: var(--text3); margin-top: 2px; }
.log-weight-input {
  width: 72px; text-align: center; padding: 8px;
  font-size: 15px; font-weight: 700;
}
.log-reps-input {
  width: 52px; text-align: center; padding: 8px;
  font-size: 15px;
}

/* History */
.history-item {
  background: var(--bg2); border-radius: var(--radius);
  margin-bottom: 8px; overflow: hidden;
}
.history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer;
}
.history-date { font-weight: 700; font-size: 15px; }
.history-type {
  font-size: 12px; font-weight: 600; padding: 3px 8px;
  border-radius: 4px;
}
.history-detail {
  padding: 0 16px 14px; display: none;
  border-top: 1px solid var(--bg3);
}
.history-detail.open { display: block; padding-top: 12px; }
.history-exercise {
  display: flex; justify-content: space-between;
  padding: 4px 0; font-size: 14px;
}
.history-exercise-name { color: var(--text2); }
.history-exercise-weight { font-weight: 600; }

/* Settings */
.setting-group {
  background: var(--bg2); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.setting-group-title {
  font-size: 13px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 12px;
}
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--bg3);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 15px; font-weight: 500; }
.setting-sublabel { font-size: 12px; color: var(--text3); }

/* Toggle switch */
.toggle {
  position: relative; width: 52px; height: 30px;
  background: var(--bg4); border-radius: 15px;
  border: none; transition: background 0.2s; flex-shrink: 0;
}
.toggle.on { background: var(--success); }
.toggle::after {
  content: ''; position: absolute;
  top: 3px; left: 3px; width: 24px; height: 24px;
  background: #fff; border-radius: 50%;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(22px); }

/* Segment control */
.segment {
  display: flex; background: var(--bg3); border-radius: var(--radius-sm);
  padding: 3px; gap: 2px;
}
.segment-btn {
  flex: 1; padding: 8px 12px; border-radius: 6px;
  background: none; color: var(--text2);
  font-size: 14px; font-weight: 600; transition: all 0.15s;
}
.segment-btn.active { background: var(--bg); color: var(--text); }

/* Timer config modal */
.timer-config {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,0.7); display: none;
  align-items: flex-end; justify-content: center;
  padding: 0;
}
.timer-config.active { display: flex; }
.timer-config-sheet {
  background: var(--bg2); border-radius: 16px 16px 0 0;
  padding: 24px 20px calc(20px + var(--safe-b));
  width: 100%; max-width: 500px;
}
.timer-config-title {
  font-size: 18px; font-weight: 700; margin-bottom: 20px;
  text-align: center;
}
.timer-config-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
}
.timer-config-label { font-size: 15px; }
.timer-config-value {
  display: flex; align-items: center; gap: 12px;
}
.timer-config-value button {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg4); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
}
.timer-config-value span {
  font-size: 18px; font-weight: 700; min-width: 40px;
  text-align: center; font-variant-numeric: tabular-nums;
}

/* Scrollbar */
.view::-webkit-scrollbar { width: 0; }

/* Progress dots (workout sections) */
.section-progress {
  display: flex; gap: 6px; justify-content: center;
  margin-bottom: 16px;
}
.section-dot {
  height: 4px; border-radius: 2px; flex: 1; max-width: 60px;
  background: var(--bg4); transition: background 0.3s;
}

/* Weekly activity tracker */
.week-tracker {
  background: var(--bg2); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px;
}
.week-days {
  display: flex; gap: 4px; margin-bottom: 8px;
}
.week-day {
  flex: 1; text-align: center; font-size: 10px; font-weight: 700;
  color: var(--text3); letter-spacing: 0.5px;
}
.week-dot {
  width: 100%; aspect-ratio: 1; border-radius: 50%;
  background: var(--bg4); margin: 4px auto 2px; max-width: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: transparent; transition: all 0.2s;
}
.week-dot.active { color: #fff; font-weight: 800; }
.week-dot.today { box-shadow: 0 0 0 2px var(--text3); }
.week-goals {
  display: flex; gap: 8px; margin-top: 8px;
}
.week-goal {
  flex: 1; display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--text3);
  padding: 6px 8px; background: var(--bg3); border-radius: var(--radius-sm);
}
.week-goal.hit { color: var(--success); background: rgba(52,199,89,0.1); }
.week-goal-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--bg4); flex-shrink: 0;
}
.week-goal.hit .week-goal-dot { background: var(--success); }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state-text { font-size: 15px; }

/* Streak strip (inside week tracker) */
.streak-strip {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bg3);
  font-size: 12px; color: var(--text2); font-weight: 600;
}
.streak-strip .streak-main { color: var(--text); font-weight: 700; }
.streak-shield { font-size: 11px; color: var(--text3); }

/* Countdown subtitle */
.countdown-sub {
  font-size: 12px; color: var(--text3); font-weight: 600; margin-top: 2px;
}
.countdown-sub b { color: var(--core); font-weight: 800; }

/* Planned-next banner */
.planned-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: rgba(127,119,221,0.12); border: 1px solid rgba(127,119,221,0.35);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px;
  font-size: 13px; font-weight: 600; color: var(--text);
}
.planned-banner .planned-clear {
  background: none; color: var(--text3); font-size: 16px; padding: 0 4px;
}

/* Weigh-in quick card */
.weighin-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg2); border-radius: var(--radius);
  padding: 10px 16px; margin-bottom: 12px;
}
.weighin-label {
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  color: var(--recovery); text-transform: uppercase;
}
.weighin-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.weighin-controls { display: flex; align-items: center; gap: 6px; }
.weighin-controls .wt-input { color: var(--recovery); width: 66px; }
.weighin-save {
  background: var(--recovery); color: #fff; font-size: 12px; font-weight: 800;
  padding: 8px 12px; border-radius: var(--radius-sm); letter-spacing: 0.5px;
}
.weighin-done { font-size: 13px; font-weight: 700; color: var(--recovery); }
.weighin-edit { background: none; color: var(--text3); font-size: 12px; text-decoration: underline; padding: 4px 0; }

/* Readiness check-in */
.readiness-card {
  background: var(--bg2); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 12px;
}
.readiness-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.readiness-btns { display: flex; gap: 8px; }
.readiness-btn {
  flex: 1; padding: 10px 4px; border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text2);
  font-size: 13px; font-weight: 600;
}
.readiness-btn span { font-size: 18px; display: block; margin-bottom: 2px; }

/* Scaled badge */
.scaled-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(91,184,154,0.15); color: var(--recovery);
  font-size: 12px; font-weight: 700; padding: 6px 10px;
  border-radius: var(--radius-sm); margin-bottom: 12px;
}

/* Deload badge */
.deload-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(91,184,154,0.15); color: var(--recovery);
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: 4px; letter-spacing: 0.5px;
}

/* Inline weight editing */
.wt-edit {
  display: inline-flex; align-items: center; gap: 6px;
}
.wt-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg3); color: var(--text);
  font-size: 16px; font-weight: 700; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.wt-btn:active { background: var(--bg4); }
.wt-input {
  width: 62px; text-align: center; padding: 6px 4px;
  font-size: 15px; font-weight: 700; color: var(--strength);
}
.wt-input.wt-edited { border-color: var(--core); color: var(--core); }
.wt-reset {
  background: none; color: var(--text3); font-size: 12px;
  font-weight: 600; padding: 4px 0; text-decoration: underline;
}
.station-wt {
  display: flex; align-items: center; gap: 6px; margin: 4px 0 2px 0;
}
.station-wt .wt-input { width: 56px; font-size: 13px; padding: 4px; }
.station-wt .wt-btn { width: 26px; height: 26px; font-size: 14px; }
.station-wt-label { font-size: 11px; color: var(--text3); font-weight: 600; }

/* Exercise swap button */
.ex-swap {

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function dateSeed(dateStr, dayType, shuffleCount) {

  const s = dateStr + dayType + (shuffleCount || 0);
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  }
  return h;
}

const GH_REPO = 'jerelaph/fitby50';
const GH_DATA_PATH = 'data/workouts.json';
const GH_API = 'https://api.github.com';

function getGitHubToken() {
  return localStorage.getItem(STORAGE_KEYS.githubToken) || '';
}

function setGitHubToken(token) {
  localStorage.setItem(STORAGE_KEYS.githubToken, token.trim());
}

function getGitHubSha() {
  return localStorage.getItem(STORAGE_KEYS.githubSha) || null;
}

function setGitHubSha(sha) {
  if (sha) localStorage.setItem(STORAGE_KEYS.githubSha, sha);
  else localStorage.removeItem(STORAGE_KEYS.githubSha);
}

async function syncToGitHub(silent) {
  const token = getGitHubToken();
  if (!token) return;

  try {
    const syncData = {
      settings: getSettings(),
      history: getHistory(),
      rotationIndex: getRotationIndex(),
      strengthCount: getStrengthCount(),
      adjustments: getAdjustments(),
      weighIns: getWeighIns(),
      lastSync: new Date().toISOString(),
      version: 2
    };

    const jsonStr = JSON.stringify(syncData, null, 2);
    const content = btoa(unescape(encodeURIComponent(jsonStr)));

    // Get current SHA (needed for updates)
    let sha = getGitHubSha();
    if (!sha) {
      try {
        const getResp = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_DATA_PATH}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (getResp.ok) {
          const d = await getResp.json();
          sha = d.sha;
        }
      } catch(e) {}
    }

    const body = {
      message: `Sync ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`,
      content: content
    };
    if (sha) body.sha = sha;

    const putResp = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_DATA_PATH}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (putResp.ok) {
      const result = await putResp.json();
      setGitHubSha(result.content.sha);
      if (!silent) showToast('Synced to GitHub ✓');
      updateSyncStatus('success');
    } else {
      // SHA mismatch — re-fetch and retry once
      if (putResp.status === 409 || putResp.status === 422) {
        setGitHubSha(null);
        if (!silent) showToast('Retrying sync...');
        return syncToGitHub(silent);
      }
      const err = await putResp.json().catch(() => ({}));
      if (!silent) showToast('Sync failed: ' + (err.message || putResp.status));
      updateSyncStatus('error');
    }
  } catch(e) {
    if (!silent) showToast('Sync error: ' + e.message);
    updateSyncStatus('error');
  }
}

async function pullFromGitHub(silent) {
  const token = getGitHubToken();
  if (!token) return false;

  try {
    const resp = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_DATA_PATH}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });

    if (!resp.ok) {
      if (resp.status === 404) {
        // No data file yet — that's fine
        return false;
      }
      return false;
    }

    const data = await resp.json();
    setGitHubSha(data.sha);

    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    const syncData = JSON.parse(decoded);

    if (!syncData.history) return false;

    // Merge histories: keep the most recent version of each date+dayType
    const localHistory = getHistory();
    const merged = new Map();

    // Add local entries first
    localHistory.forEach(h => merged.set(h.date + '|' + h.dayType, h));

    // Remote entries override if they have a newer completedAt, otherwise skip
    let newCount = 0;
    syncData.history.forEach(rh => {
      const key = rh.date + '|' + rh.dayType;
      if (!merged.has(key)) {
        merged.set(key, rh);
        newCount++;
      }
    });

    const sortedHistory = Array.from(merged.values()).sort((a, b) => b.date.localeCompare(a.date));
    saveHistory(sortedHistory);

    // Merge weigh-ins by date (local wins on conflict)
    if (Array.isArray(syncData.weighIns) && syncData.weighIns.length > 0) {
      const wMap = {};
      syncData.weighIns.forEach(w => { if (w && w.date && w.weight > 0) wMap[w.date] = w.weight; });
      getWeighIns().forEach(w => { wMap[w.date] = w.weight; });
      saveWeighIns(Object.keys(wMap).sort().map(d => ({ date: d, weight: wMap[d] })));
    }

    // Pull settings + rotation if this device has no history (fresh install)
    if (localHistory.length === 0 && syncData.settings) {
      saveSettings(syncData.settings);
      if (syncData.rotationIndex !== undefined) setRotationIndex(syncData.rotationIndex);
      if (syncData.strengthCount !== undefined) setStrengthCount(syncData.strengthCount);
      if (syncData.adjustments) saveAdjustments(syncData.adjustments);
    }

    if (newCount > 0 && !silent) {
      showToast(`Pulled ${newCount} workout(s) from GitHub`);
    }
    updateSyncStatus('success');
    return newCount > 0;
  } catch(e) {
    console.log('GitHub pull failed:', e);
    updateSyncStatus('error');
    return false;
  }
}

function updateSyncStatus(status) {
  const el = document.getElementById('gh-sync-status');
  if (!el) return;
  if (status === 'success') {
    el.textContent = 'Last sync: ' + new Date().toLocaleTimeString();
    el.style.color = 'var(--success)';
  } else if (status === 'error') {
    el.textContent = 'Sync failed';
    el.style.color = 'var(--danger)';
  } else {
    el.textContent = 'Syncing...';
    el.style.color = 'var(--text3)';
  }
}

async function manualSync() {
  const token = getGitHubToken();
  if (!token) {
    showToast('Enter a GitHub token first');
    return;
  }
  showToast('Syncing...');
  await pullFromGitHub(true);
  await syncToGitHub(false);
  renderHistory();
}

function shuffleArray(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickN(arr, n, rng) {
  return shuffleArray(arr, rng).slice(0, n);
}

function weightedPick(items, rng) {
  const totalWeight = items.reduce((s, i) => s + i.weight, 0);
  let r = rng() * totalWeight;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item;
  }
  return items[items.length - 1];
}

function roundTo5(n) {
  return Math.round(n / 5) * 5;
}

function calcWeight(oneRM, pct) {
  if (!oneRM || oneRM <= 0) return 0;
  return roundTo5(oneRM * pct / 100);
}

function formatTime(seconds) {
  const m = Math.floor(Math.abs(seconds) / 60);
  const s = Math.abs(seconds) % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function todayStr() {
  const d = new Date();
  return localDateStr(d);
}

function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Estimated 1RM (Epley). Only meaningful for 1-12 rep sets.
function epley1RM(weight, reps) {
  if (!weight || weight <= 0 || !reps || reps <= 0) return 0;
  if (reps === 1) return weight;
  if (reps > 12) return 0;
  return Math.round(weight * (1 + reps / 30));
}

// Monday (local) of the week containing dateStr, as YYYY-MM-DD
function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();
  d.setDate(d.getDate() - ((dow + 6) % 7));
  return localDateStr(d);
}

// This week's activity stats — shared by week tracker + summary
function computeWeekStats(history) {
  const monStr = mondayOf(todayStr());
  const sun = new Date(monStr + 'T12:00:00');
  sun.setDate(sun.getDate() + 6);
  const sunStr = localDateStr(sun);
  const intenseDayTypes = ['weekday', 'saturday', 'sunday'];
  let active = 0, intense = 0, z2 = 0;
  history.forEach(h => {
    if (h.date >= monStr && h.date <= sunStr) {
      active++;
      if (intenseDayTypes.includes(h.dayType)) intense++;
      if (h.z2Minutes > 0) z2 += h.z2Minutes;
    }
  });
  return { active: active, intense: intense, z2: z2 };
}

// Weekly-consistency streaks (3+ workouts = a good week) with one
// "streak shield" per calendar month: a single missed week per month
// doesn't break the chain. The in-progress week never breaks it.
function computeStreaks(history) {
  const weekCounts = {};
  history.forEach(h => {
    const wk = mondayOf(h.date);
    weekCounts[wk] = (weekCounts[wk] || 0) + 1;
  });
  const weekKeys = Object.keys(weekCounts).sort();
  if (weekKeys.length === 0) return { current: 0, best: 0, shieldWeek: null };

  const thisWeek = mondayOf(todayStr());
  const firstWeek = weekKeys[0];

  // Current streak: walk backwards from this week
  let current = 0;
  let shieldWeek = null;
  const shieldMonths = {};
  let wk = thisWeek;
  for (let guard = 0; guard < 520; guard++) {
    if (wk < firstWeek) break;
    const cnt = weekCounts[wk] || 0;
    if (cnt >= 3) {
      current++;
    } else if (wk === thisWeek) {
      // week in progress — neither counts nor breaks
    } else {
      const month = wk.slice(0, 7);
      if (!shieldMonths[month]) {
        shieldMonths[month] = true;
        if (!shieldWeek) shieldWeek = wk;
      } else {
        break;
      }
    }
    const prev = new Date(wk + 'T12:00:00');
    prev.setDate(prev.getDate() - 7);
    wk = localDateStr(prev);
  }

  // Best streak: forward scan with the same shield rule per run
  let best = 0, run = 0;
  let runShields = {};
  wk = firstWeek;
  for (let guard = 0; guard < 520; guard++) {
    if (wk > thisWeek) break;
    const cnt = weekCounts[wk] || 0;
    if (cnt >= 3) {
      run++;
      if (run > best) best = run;
    } else if (wk !== thisWeek) {
      const month = wk.slice(0, 7);
      if (run > 0 && !runShields[month]) {
        runShields[month] = true; // shield absorbs the miss
      } else {
        run = 0;
        runShields = {};
      }
    }
    const next = new Date(wk + 'T12:00:00');
    next.setDate(next.getDate() + 7);
    wk = localDateStr(next);
  }
  if (current > best) best = current;

  // Is the shield still available this month (for the current streak)?
  const thisMonth = thisWeek.slice(0, 7);
  const shieldAvailable = !shieldMonths[thisMonth];

  return { current: current, best: best, shieldWeek: shieldWeek, shieldAvailable: shieldAvailable };
}

// Tiny inline SVG sparkline
function sparkline(values, color, w, h) {
  w = w || 110; h = h || 26;
  if (!values || values.length < 2) return '';
  const min = Math.min.apply(null, values);
  const max = Math.max.apply(null, values);
  const span = (max - min) || 1;
  const px = (i) => (i / (values.length - 1)) * w;
  const py = (v) => h - 3 - ((v - min) / span) * (h - 6);
  const pts = values.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1)).join(' ');
  const lastY = py(values[values.length - 1]).toFixed(1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;flex-shrink:0;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="${w}" cy="${lastY}" r="2.5" fill="${color}"/>
  </svg>`;
}

// Max estimated 1RM per lift from a history entry
function entryE1RM(h, liftName) {
  let best = 0;
  (h.exercises || []).forEach(e => {
    if (e.name === liftName && e.isMainLift && e.checked && !e.failed && e.weight > 0 && e.reps > 0) {
      const est = epley1RM(e.weight, e.reps);
      if (est > best) best = est;
    }
  });
  return best;
}

function applyEquipSubs(exerciseName, equipment) {
  if (equipment === 'ymca') return exerciseName;
  return HOME_SUBS[exerciseName] || exerciseName;
}

function filterForEquipment(exercises, equipment) {
  if (equipment === 'ymca') return exercises;
  return exercises.filter(e => e !== 'Chin-ups').map(e => HOME_SUBS[e] || e);
}

// Hernia recovery is GRADED EXPOSURE, not a life sentence.
// Phase 1: DL flagged >75%, loads capped ~78%, RPE 7
// Phase 2: DL flagged >82%, loads capped ~84%, RPE 8
// Phase 3: monitoring only — flags off except ballistic cleans
function herniaPhaseRules(settings) {
  const p = settings.herniaPhase || 1;
  if (p >= 3) return { phase: 3, dlFlagPct: 999, pctCap: 999, rpeNote: 'Phase 3 — monitoring. Full loading, keep the brace habits.' };
  if (p === 2) return { phase: 2, dlFlagPct: 82, pctCap: 84, rpeNote: 'RPE Cap: 8 — Phase 2. Heavier is earned; keep 2 reps in the tank.' };
  return { phase: 1, dlFlagPct: 75, pctCap: 78, rpeNote: 'RPE Cap: 7 — Phase 1. Focus on form & midline stability.' };
}

function isHerniaFlagged(exerciseName, pct, settings) {
  if (!settings.herniaMode) return false;
  const rules = herniaPhaseRules(settings);
  if (exerciseName === 'Lionmaker') return true;
  if (exerciseName === 'BB Deadlift' && pct > rules.dlFlagPct) return true;
  if (rules.phase < 3 && HERNIA_FLAGS.some(f => exerciseName.includes(f) && exerciseName !== 'BB Deadlift')) return true;
  if (rules.phase >= 3 && ['Heavy Clean', 'Power Clean', 'Squat Clean'].some(f => exerciseName.includes(f))) return true;
  return false;
}

// Current periodization phase from the strength-session counter
function currentPhase() {
  return PHASES[Math.floor(getStrengthCount() / 4) % 4];
}

// Every 16 strength sessions (~1 quarter of cycles): benchmark day
function isBenchmarkDay() {
  const c = getStrengthCount();
  return c > 0 && c % 16 === 0;
}

function generateWod(dayType, dateStr) {
  const settings = getSettings();
  const rotIdx = getRotationIndex();
  const rng = mulberry32(dateSeed(dateStr, dayType, getShuffleCount()));

  let wod = {
    date: dateStr,
    dayType: dayType,
    rotationIndex: rotIdx,
    equipment: settings.equipment,
    sections: []
  };

  if (dayType === 'weekday') {
    wod = generateWeekday(wod, settings, rotIdx, rng);
  } else if (dayType === 'saturday') {
    wod = generateSaturday(wod, settings, rotIdx, rng);
  } else if (dayType === 'recovery') {
    wod = generateRecovery(wod, settings, rng);
  } else {
    wod = generateSunday(wod, settings, rng);
  }

  // Readiness scaling: low tank → -10% loads, one fewer conditioning round.
  // Turns "too tired, skip" into "do the lighter version" — the habit survives.
  const readiness = getReadiness();
  wod.readiness = readiness;
  wod.strengthCount = getStrengthCount();
  if (readiness === 'low' && dayType !== 'recovery') {
    wod.scaled = true;
    wod.sections.forEach(s => {
      if (s.type === 'strength') {
        s.weights = s.weights.map(w => ({ pct: w.pct, weight: roundTo5(w.weight * 0.9) }));
      } else if ((s.type === 'core' || s.type === 'hiit' || s.type === 'glute') && s.rounds > 2) {
        s.rounds = s.rounds - 1;
        s.format = s.format.replace(/^\d+ RDS/, s.rounds + ' RDS');
      } else if (s.type === 'strengthcon' && s.rounds > 2) {
        s.rounds = s.rounds - 1;
        s.format = s.rounds + ' RDS or 30 MIN Cap';
      }
    });
  }

  return wod;
}

function generateRecovery(wod, settings, rng) {
  // Mobility warm-up (5 min)
  const mobilityMoves = pickN(RECOVERY_MOBILITY, 5, rng);
  wod.sections.push({
    type: 'recovery-warmup',

  });

  const available = RECOVERY_CARDIO.filter(c =>
    c.equipment === 'all' || c.equipment === settings.equipment
  );
  const cardio = available[Math.floor(rng() * available.length)];

  wod.sections.push({

    format: cardio.format,
    protocol: cardio.protocol,
    duration: cardio.duration
  });

function generateWarmup(liftCategory, rng) {
  const specific = liftCategory ? (WARMUP_BY_LIFT[liftCategory] || WARMUP_DYNAMIC) : WARMUP_DYNAMIC;
  const general = pickN(WARMUP_DYNAMIC, 3, rng);
  const spec = pickN(specific, 3, rng);
  const combined = [...new Set([...general, ...spec])].slice(0, 5);
  // BLF-style: always open on the machine — blood flow before movement prep
  const machine = getSettings().equipment === 'ymca' ? 'Row or Bike — easy' : 'Assault Bike — easy';
  return {
    type: 'warmup',
    label: 'WARM-UP',
    format: '2 RDS — :45 work / :15 rest',
    rounds: 2,
    work: 45,
    rest: 15,
    exercises: [{ name: machine, reps: ':45', isBarbell: false }, ...combined.map(e => ({ name: e, reps: ':45' }))]
  };
}

function generateStrength(rotIdx, settings, rng) {
  const liftCat = LIFT_ROTATION[rotIdx];
  const lifts = PRIMARY_LIFTS[liftCat];
  const mainLift = lifts[Math.floor(rng() * lifts.length)];
  const format = weightedPick(STRENGTH_FORMATS, rng);
  const rx = LOADING_RX[mainLift];
  const oneRMKey = rx ? rx.oneRMKey : null;
  let oneRM = oneRMKey ? (settings.oneRM[oneRMKey] || 0) : 0;

  // Autoregulation: a failed session pulls the next one down ~7.5%
  const adjustments = getAdjustments();
  const adjFactor = (oneRMKey && adjustments[oneRMKey]) ? adjustments[oneRMKey] : 1;
  if (adjFactor < 1) oneRM = Math.round(oneRM * adjFactor);

  // Periodization: the stimulus waves across cycles instead of repeating.
  const phase = currentPhase();
  const benchmark = isBenchmarkDay();
  const deload = phase.key === 'deload';
  const herniaRules = settings.herniaMode ? herniaPhaseRules(settings) : null;
  const pctCap = herniaRules ? herniaRules.pctCap : 92;

  let reps = rx ? rx.reps : 8;
  let buildPattern = rx ? rx.buildPattern : [60,65,70,75,80];
  let tempoNote = '';

  if (deload) {
    buildPattern = buildPattern.map(p => Math.max(40, Math.round(p * 0.7)));
  } else if (phase.key === 'strength') {
    reps = Math.max(4, reps - 3);
    buildPattern = buildPattern.map(p => Math.min(pctCap, p + 5));
  } else if (phase.key === 'peak') {
    if (settings.herniaMode && (herniaRules.phase < 3)) {
      // Hernia phases 1-2: peak via TEMPO, not top-end load (BLF-style pauses)
      reps = Math.max(4, reps - 3);
      buildPattern = buildPattern.map(p => Math.min(pctCap, p + 3));
      tempoNote = 'First 3 reps each round w/ (:03) pause at the hard point — control is the overload.';
    } else {
      reps = 3;
      buildPattern = buildPattern.map(p => Math.min(pctCap, p + 10));
    }
  } else {
    // volume phase: pattern as prescribed, cap for hernia safety
    buildPattern = buildPattern.map(p => Math.min(pctCap, p));
  }

  if (benchmark) {
    reps = 5;
    buildPattern = [50, 60, 70, 78, 84].map(p => Math.min(pctCap, p));
  }
  // Adjust pattern length to match rounds
  if (format.rounds !== buildPattern.length) {
    if (format.rounds < buildPattern.length) {
      buildPattern = buildPattern.slice(0, format.rounds);
    } else {
      while (buildPattern.length < format.rounds) {
        buildPattern.push(buildPattern[buildPattern.length - 1]);
      }
    }
  }

  const weights = buildPattern.map(pct => ({
    pct: pct,
    weight: calcWeight(oneRM, pct)
  }));

  // Accessory for remaining time (deadlift day always offers a carry —
  // grip + brace work is the point of the hinge day)
  const accessoryPool = liftCat === 'squat' ? EXERCISES.squat :
                        liftCat === 'bench' ? EXERCISES.push :
                        liftCat === 'deadlift' ? [...EXERCISES.hinge, ...CARRIES] :
                        EXERCISES.push;
  const accessory = pickN(filterForEquipment(accessoryPool, settings.equipment), 2, rng);

  const herniaFlags = [];
  weights.forEach((w, i) => {
    if (isHerniaFlagged(mainLift, w.pct, settings)) {
      herniaFlags.push(i);
    }
  });

  return {
    type: 'strength',
    label: 'STRENGTH',
    liftCategory: liftCat,
    mainLift: mainLift,
    format: benchmark ? '5 x 3:00 — BENCHMARK' : format.label,
    formatDetail: format,
    reps: reps,
    phaseKey: benchmark ? 'benchmark' : phase.key,
    phaseLabel: benchmark ? 'BENCHMARK' : phase.label,
    phaseNote: benchmark ? 'Build to a solid top set of 5 — this re-validates your e1RM. Log every round.' : phase.note,
    tempoNote: tempoNote,
    buildPattern: buildPattern,
    weights: weights,
    oneRM: oneRM,
    accessory: accessory.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '10-12' })),
    herniaFlags: herniaFlags,
    herniaMode: settings.herniaMode,
    deload: deload,
    autoRegulated: adjFactor < 1
  };
}

function generateCore(rng, equipment) {
  // BLF-style variety: interval rounds or a 5-min AMRAP with rep targets
  const amrap = rng() < 0.4;
  if (amrap) {
    const exercises = pickN(EXERCISES.core, 4, rng);
    const repOpts = ['15 reps', '20 reps', '12 ea', '10 ea', ':30 hold'];
    return {
      type: 'core',
      label: 'CORE',
      format: '5 MIN AMRAP',
      coreAmrap: true,
      duration: 5 * 60,
      exercises: exercises.map(e => ({
        name: applyEquipSubs(e, equipment),
        reps: repOpts[Math.floor(rng() * repOpts.length)]
      }))
    };
  }
  const exercises = pickN(EXERCISES.core, 5, rng);
  return {
    type: 'core',
    label: 'CORE',
    format: '3 RDS — :30 work / :15 rest',
    rounds: 3,
    work: 30,
    rest: 15,
    exercises: exercises.map(e => ({ name: applyEquipSubs(e, equipment), reps: ':30' }))
  };
}

function generateMetcon(rng, settings) {
  const metType = weightedPick(METCON_TYPES, rng);
  const push = pickN(filterForEquipment(EXERCISES.push, settings.equipment), 1, rng);
  const pull = pickN(filterForEquipment(EXERCISES.pull, settings.equipment), 1, rng);
  const sq = pickN(filterForEquipment(EXERCISES.squat, settings.equipment), 1, rng);
  const combo = pickN(filterForEquipment(EXERCISES.metcon_combo, settings.equipment), 1, rng);
  const cond = pickN(filterForEquipment(EXERCISES.conditioning, settings.equipment), 1, rng);

  let exercises = [...combo, ...push, ...pull, ...sq, ...cond];
  exercises = [...new Set(exercises)].slice(0, 5);

  const repOptions = [8, 10, 12, 15, 20];
  const calOptions = [10, 12, 15, 20];

  const exList = exercises.map(e => {
    const isCond = EXERCISES.conditioning.includes(e) || ['Assault Bike', 'Row', 'Rower'].includes(e);
    const isCombo = EXERCISES.metcon_combo.includes(e);
    let reps;
    if (isCond) {
      reps = calOptions[Math.floor(rng() * calOptions.length)] + ' Cal';
    } else if (isCombo) {
      reps = String([6, 8, 10][Math.floor(rng() * 3)]);
    } else {
      reps = String(repOptions[Math.floor(rng() * repOptions.length)]);
    }
    return { name: applyEquipSubs(e, settings.equipment), reps: reps };
  });

  let format, timerConfig;
  if (metType.type === 'rft') {
    const rounds = [3, 4, 5][Math.floor(rng() * 3)];
    format = `${rounds} RDS For Time`;
    timerConfig = { mode: 'forTime', rounds: rounds, cap: rounds * 4 * 60 };
  } else if (metType.type === 'amrap') {
    const mins = [10, 12, 14, 15][Math.floor(rng() * 4)];
    format = `${mins} MIN AMRAP — Goal: 3+ RDS`;
    timerConfig = { mode: 'amrap', duration: mins * 60 };
  } else if (metType.type === 'rounds_cap') {
    const rounds = [3, 4][Math.floor(rng() * 2)];
    const cap = [12, 14, 16][Math.floor(rng() * 3)];
    format = `${rounds} RDS OR ${cap} MIN`;
    timerConfig = { mode: 'forTime', rounds: rounds, cap: cap * 60 };
  } else {
    const mins = [10, 12, 16][Math.floor(rng() * 3)];
    format = `${mins} MIN EMOM`;
    timerConfig = { mode: 'emom', duration: mins * 60, interval: 60 };
  }

  const herniaExercises = exList.filter(e => isHerniaFlagged(e.name, 100, settings));

  return {
    type: 'metcon',
    label: 'METCON',
    metconType: metType.type,
    format: format,
    timerConfig: timerConfig,
    exercises: exList,
    herniaExercises: herniaExercises.map(e => e.name),
    herniaMode: settings.herniaMode
  };
}

function generateWeekday(wod, settings, rotIdx, rng) {
  const liftCat = LIFT_ROTATION[rotIdx];
  // Session order: warm-up → (power) → core → strength → metcon → optional Z2
  wod.sections.push(generateWarmup(liftCat, rng));

  // Power primer once a week: first weekday session of the week, done FRESH.
  // Explosive capacity fades ~2x faster than strength after 50 — and it only
  // trains when you're not tired.
  const monday = mondayOf(wod.date);
  const weekdayDoneThisWeek = getHistory().some(h =>
    h.dayType === 'weekday' && h.date >= monday && h.date < wod.date
  );
  if (!weekdayDoneThisWeek) {
    let pool = POWER_MOVES.filter(m => !(settings.herniaMode && herniaPhaseRules(settings).phase === 1 && m.name === 'Broad Jumps'));
    const pick = pool[Math.floor(rng() * pool.length)];
    wod.sections.push({
      type: 'power',
      label: 'POWER PRIMER',
      format: pick.rx + ' — FULL rest between sets',
      powerNote: 'Fresh, crisp, explosive. If a rep slows down, rest longer. This is skill work, not conditioning.',
      exercises: [{ name: pick.name, reps: pick.rx }]
    });
  }

  wod.sections.push(generateCore(rng, settings.equipment));
  wod.sections.push(generateStrength(rotIdx, settings, rng));
  wod.sections.push(generateMetcon(rng, settings));

  // Optional Zone 2 flush — easy spin, counts toward the weekly Z2 goal
  const flushMin = [10, 12, 15][Math.floor(rng() * 3)];
  wod.sections.push({
    type: 'recovery-cardio',
    label: 'ZONE 2 FLUSH — OPTIONAL',
    format: `${flushMin} min — nose-breathing pace`,
    protocol: [
      { label: 'Machine', detail: settings.equipment === 'ymca' ? 'Bike, rower, or incline walk' : 'Assault bike — easy spin' },
      { label: 'Effort', detail: 'Conversational. If you can\'t nose-breathe, slow down.' }
    ],
    duration: flushMin,
    optional: true
  });

  return wod;
}

function generateSaturday(wod, settings, rotIdx, rng) {
  const liftCat = LIFT_ROTATION[rotIdx];
  wod.sections.push(generateWarmup(liftCat, rng));

  // StrengthCon: 7-8 stations, 5 RDS or 30min cap
  const push = pickN(filterForEquipment(EXERCISES.push, settings.equipment), 1, rng);
  const pull = pickN(filterForEquipment(EXERCISES.pull, settings.equipment), 1, rng);
  const sq = pickN(filterForEquipment(EXERCISES.squat, settings.equipment), 2, rng);
  const hinge = pickN(filterForEquipment(EXERCISES.hinge, settings.equipment), 1, rng);
  const cond = pickN(filterForEquipment(EXERCISES.conditioning, settings.equipment), 1, rng);
  const combo = pickN(filterForEquipment(EXERCISES.metcon_combo, settings.equipment), 1, rng);

  // Add a barbell station related to the lift rotation
  const liftOptions = PRIMARY_LIFTS[liftCat];
  const bbLift = liftOptions[Math.floor(rng() * liftOptions.length)];
  const rx = LOADING_RX[bbLift];
  const oneRMKey = rx ? rx.oneRMKey : null;
  const oneRM = oneRMKey ? (settings.oneRM[oneRMKey] || 0) : 0;
  const bbPct = rx ? Math.floor((rx.pctRange[0] + rx.pctRange[1]) / 2) : 65;
  const bbWeight = calcWeight(oneRM, bbPct);

  // Weekly carry guarantee — grip and brace work lives here
  const carry = CARRIES[Math.floor(rng() * CARRIES.length)];

  let stations = [
    { name: bbLift, reps: `${rx ? rx.reps : 8} @ ${bbWeight}lb (${bbPct}%)`, isBarbell: true, weight: bbWeight, pct: bbPct },
    ...combo.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '10' })),
    ...push.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '12' })),
    ...pull.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '12' })),
    ...sq.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '10 ea' })),
    ...hinge.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '12' })),
    ...cond.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: '15 Cal' }))
  ];
  stations = [...new Map(stations.map(s => [s.name, s])).values()].slice(0, 7);
  stations.push({ name: carry, reps: carry === 'Plate Pinch Hold' ? ':40 hold' : '40 yd (or :40)' });

  wod.sections.push({
    type: 'strengthcon',
    label: 'STRENGTHCON',
    wodName: WOD_NAMES[Math.floor(rng() * WOD_NAMES.length)],
    liftCategory: liftCat,
    format: '5 RDS or 30 MIN Cap',
    rounds: 5,
    cap: 30 * 60,
    exercises: stations,
    herniaMode: settings.herniaMode
  });

  // Glute supplement
  const glutes = pickN(EXERCISES.glute, 5, rng);
  wod.sections.push({
    type: 'glute',
    label: 'GLUTEY CAMP',
    format: '4 RDS — :40 work / :20 rest',
    rounds: 4,
    work: 40,
    rest: 20,
    exercises: glutes.map(e => ({ name: e, reps: ':40' }))
  });

  return wod;
}

function generateSunday(wod, settings, rng) {
  wod.sections.push(generateWarmup(null, rng));

  // HIIT: ~10 stations, 4 RDS :40/:20, bodyweight-dominant
  const core = pickN(EXERCISES.core, 2, rng);
  const push = pickN(filterForEquipment(EXERCISES.push.filter(e => !e.includes('DB') || e === 'Push-ups'), settings.equipment), 2, rng);
  const sq = pickN(filterForEquipment(EXERCISES.squat, settings.equipment), 2, rng);
  const cond = pickN(filterForEquipment(EXERCISES.conditioning, settings.equipment), 1, rng);
  const hinge = pickN(filterForEquipment(EXERCISES.hinge, settings.equipment), 1, rng);
  const combo = pickN(filterForEquipment(['Burpee Box Jump Over', 'DB Burpee', 'Wall Ball'], settings.equipment), 1, rng);
  const extra = pickN(filterForEquipment(['Mountain Climbers', 'Star Sit-up', 'Lateral Skater Jumps', 'Alt Step-ups', 'High Knees', 'Tuck Jumps'], settings.equipment), 1, rng);

  let stations = [...combo, ...push, ...sq, ...hinge, ...core, ...cond, ...extra];
  stations = [...new Set(stations)].slice(0, 10);

  wod.sections.push({
    type: 'hiit',
    label: 'HIIT DAY',
    format: '4 RDS — :40 work / :20 rest',
    rounds: 4,
    work: 40,
    rest: 20,
    exercises: stations.map(e => ({ name: applyEquipSubs(e, settings.equipment), reps: ':40' }))
  });

  return wod;
}

// RENDER FUNCTIONS

let currentDayType = 'weekday';
let currentWod = null;

function switchView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewName).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewName);
  });
  if (viewName === 'today') renderToday();
  else if (viewName === 'log') renderLog();
  else if (viewName === 'history') renderHistory();
  else if (viewName === 'settings') renderSettings();
}

function renderToday() {
  const settings = getSettings();
  const dateStr = todayStr();
  const badge = document.getElementById('equip-badge');
  badge.textContent = settings.equipment.toUpperCase();
  badge.className = 'equip-badge ' + settings.equipment;

  // Check for stored wod with same date + dayType + rotation + equipment + shuffle
  const stored = getCurrentWod();
  const sc = getShuffleCount();
  if (stored && stored.date === dateStr && stored.dayType === currentDayType && stored.equipment === settings.equipment && stored.rotationIndex === getRotationIndex() && (stored.shuffleCount || 0) === sc && (stored.readiness || null) === getReadiness() && (stored.strengthCount || 0) === getStrengthCount()) {
    currentWod = stored;
  } else {
    currentWod = generateWod(currentDayType, dateStr);
    currentWod.shuffleCount = sc;
    saveCurrentWod(currentWod);
  }

  renderCountdown();
  renderWeekTracker();
  renderPlannedBanner();
  renderWeighInCard();
  renderReadinessCard();
  renderRotation();
  renderWodContent(currentWod);
}

// "X days to 50 — Y workouts banked"
function renderCountdown() {
  const el = document.getElementById('today-countdown');
  if (!el) return;
  const s = getSettings();
  if (!s.birthday) { el.innerHTML = ''; return; }
  const b = new Date(s.birthday + 'T12:00:00');
  if (isNaN(b.getTime())) { el.innerHTML = ''; return; }
  const fifty = new Date(b);
  fifty.setFullYear(b.getFullYear() + 50);
  const now = new Date(todayStr() + 'T12:00:00');
  const days = Math.round((fifty - now) / 86400000);
  const total = getHistory().length;
  if (days > 0) {
    el.innerHTML = `<b>${days}</b> day${days === 1 ? '' : 's'} to 50 &nbsp;·&nbsp; <b>${total}</b> workout${total === 1 ? '' : 's'} banked`;
  } else {
    el.innerHTML = `50 and strong &nbsp;·&nbsp; <b>${total}</b> workout${total === 1 ? '' : 's'} banked`;
  }
}

// Planned-next banner (implementation intention made visible)
function renderPlannedBanner() {
  const el = document.getElementById('planned-banner');
  if (!el) return;
  const p = getPlannedNext();
  if (!p || !p.date) { el.innerHTML = ''; return; }
  if (p.date < todayStr()) { savePlannedNext(null); el.innerHTML = ''; return; }
  const d = new Date(p.date + 'T12:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const isToday = p.date === todayStr();
  const dayLabel = isToday ? 'Today' : days[d.getDay()];
  el.innerHTML = `<div class="planned-banner">
    <span>📅 Planned: <b>${dayLabel} ${p.time || ''}</b>${p.focus ? ' — ' + p.focus : ''}</span>
    <button class="planned-clear" onclick="savePlannedNext(null);renderPlannedBanner();" title="Clear plan">✕</button>
  </div>`;
}

// Quick weigh-in on the landing page — works on rest days too
let weighInEditing = false;

function renderWeighInCard() {
  const el = document.getElementById('weighin-card');
  if (!el) return;
  const today = todayStr();
  const todays = getWeighIns().find(w => w.date === today);

  if (todays && !weighInEditing) {
    el.innerHTML = `<div class="weighin-row">
      <div>
        <div class="weighin-label">⚖ Weigh-in</div>
