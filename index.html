let confirmCallback = null;

function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = cb;
  document.getElementById('confirm-overlay').classList.add('active');
}

function closeConfirm(result) {
  document.getElementById('confirm-overlay').classList.remove('active');
  if (confirmCallback) confirmCallback(result);
  confirmCallback = null;
  // Restore default button styling (the disclaimer relabels it)
  const okBtn = document.getElementById('confirm-ok');
  if (okBtn) { okBtn.textContent = 'Confirm'; okBtn.className = 'btn btn-danger btn-sm'; }
}

function confirmReset() {
  showConfirm('Reset All Data', 'This will delete all workout history, settings, and log data. This cannot be undone.', (ok) => {
    if (ok) {
      Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      showToast('All data cleared');
      renderSettings();
    }
  });
}

// ============================================================
// EXPORT / IMPORT
// ============================================================

function backupOverdue() {
  const s = getSettings();
  if (getHistory().length < 5) return false;
  if (!s.lastBackup) return true;
  const last = new Date(s.lastBackup + 'T12:00:00');
  return (new Date() - last) > 30 * 86400000;
}

function exportData() {
  const s0 = getSettings();
  s0.lastBackup = todayStr();
  saveSettings(s0);
  const data = {
    settings: getSettings(),
    history: getHistory(),
    rotationIndex: getRotationIndex(),
    strengthCount: getStrengthCount(),
    adjustments: getAdjustments(),
    weighIns: getWeighIns(),
    exported: new Date().toISOString(),
    version: 2
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitby50-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported backup file');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.history || !Array.isArray(data.history)) {
        showToast('Invalid backup file');
        return;
      }
      showConfirm('Import Data', `Import ${data.history.length} workouts? This will merge with existing data.`, (ok) => {
        if (ok) {
          const local = getHistory();
          const merged = new Map();
          local.forEach(h => merged.set(h.date + '|' + h.dayType, h));
          data.history.forEach(h => {
            const key = h.date + '|' + h.dayType;
            if (!merged.has(key)) merged.set(key, h);
          });
          const sorted = Array.from(merged.values()).sort((a, b) => b.date.localeCompare(a.date));
          saveHistory(sorted);
          if (data.settings) saveSettings(data.settings);
          if (data.rotationIndex !== undefined) setRotationIndex(data.rotationIndex);
          showToast(`Imported — ${sorted.length} total workouts`);
          renderSettings();
        }
      });
    } catch(err) {
      showToast('Error reading file');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ============================================================
// TOAST
// ============================================================

function showCue(name) {
  const cue = CUES[name];
  if (cue) showToast('💡 ' + cue);
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;top:48px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:3000;opacity:0;transition:opacity 0.3s;pointer-events:none;text-align:center;max-width:90%;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDayType = btn.dataset.day;
    // Force regeneration, reset shuffle
    setShuffleCount(0);
    localStorage.removeItem(STORAGE_KEYS.currentWod);
    localStorage.removeItem(STORAGE_KEYS.currentLog);
    renderToday();
  });
});

// ============================================================
// INIT
// ============================================================

async function init() {
  // Set initial day type based on actual day
  const today = new Date();
  const dow = today.getDay();
  if (dow === 0) currentDayType = 'sunday';
  else if (dow === 6) currentDayType = 'saturday';
  else currentDayType = 'weekday';

  document.querySelectorAll('.day-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.day === currentDayType);
  });

  renderToday();

  // Pull from GitHub on startup (non-blocking)
  if (getGitHubToken()) {
    pullFromGitHub(true).then(changed => {
      if (changed) renderToday();
    });
  }

  // PWA: offline support + installability (relative path survives the
  // move from GitHub Pages to a custom domain)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // One-time disclaimer acknowledgment
  if (!localStorage.getItem(STORAGE_KEYS.disclaimerAck)) {
    showConfirm(
      'Before you train',
      'FitBy50 is a personal training log, not medical advice. Consult a physician before starting or changing an exercise program — especially when training through injury recovery. Stop any movement that causes pain.',
      () => { localStorage.setItem(STORAGE_KEYS.disclaimerAck, '1'); }
    );
    const okBtn = document.getElementById('confirm-ok');
    if (okBtn) { okBtn.textContent = 'Got it'; okBtn.className = 'btn btn-primary btn-sm'; }
  }

  // Monthly backup nudge
  if (backupOverdue()) {
    setTimeout(() => showToast('📦 It\'s been a while — export a backup in Settings'), 2500);
  }
}

init();
</script>
